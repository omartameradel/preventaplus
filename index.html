    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff;

        }

        #loading {
            display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;
        }

            display: none;

            z-index: 99999; color: white; text-align: center;
        }
        
        .maintenance-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 50px 60px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);

            animation: float 4s ease-in-out infinite;
            max-width: 90%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .icon-container {
            position: relative; height: 100px; margin-bottom: 20px;
        }
        
        .gear {
            position: absolute; font-size: 55px; line-height: 1; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
        }
        .gear1 {
            left: calc(50% - 30px); top: 0; color: #38bdf8;
            animation: spinGear 4s linear infinite;
        }
        .gear2 {
            left: calc(50% + 15px); top: 35px; font-size: 40px; color: #93c5fd;
            animation: spinGearReverse 4s linear infinite;
        }

        @keyframes spinGear { 100% { transform: rotate(360deg); } }
        @keyframes spinGearReverse { 100% { transform: rotate(-360deg); } }

        #maintenance-text {
            font-size: clamp(1.5rem, 4vw, 2.8rem);
            margin: 0; font-weight: 900;
            background: linear-gradient(to left, #38bdf8, #818cf8, #e0e7ff);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .maintenance-desc {
            color: #94a3b8; font-size: 1.2rem; margin-top: 15px; font-weight: 400;
        }

        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.1);
            border-radius: 20px; margin-top: 40px; overflow: hidden; position: relative;
        }
        
        .progress-indicator {
            width: 50%; height: 100%;
            background: linear-gradient(90deg, #3b82f6, #38bdf8, #818cf8);
            border-radius: 20px;
            animation: loadingProgress 2s infinite ease-in-out alternate;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        @keyframes loadingProgress {
            0% { width: 10%; transform: translateX(-100%); }
            100% { width: 60%; transform: translateX(200%); }
        }
