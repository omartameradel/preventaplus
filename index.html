<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PreventaPlus</title>
    <link rel="icon" type="image/x-icon" href="/6384.png" />
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: white;
        }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 10;
        }
        #loading h2 { color: #2563eb; font-family: sans-serif; }
        #contentIframe {
            width: 100%; height: 100%;
            border: none; display: block;
        }
    </style>
</head>
<body>
    <div id="loading"><h2>جاري تحميل الصفحة...</h2></div>
    <iframe id="contentIframe" title="Dynamic Content"></iframe>
    <script type="module" src="assets/main.js"></script>
</body>
</html>
