<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المستخدمون النشطون الآن</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #102f59;
      --text-sub: #607a8b;
      --border-color: #dbe7ed;
      --hover-bg: #f8fbfb;
      --primary: #183047;
    }
    
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #e0e0e0;
      --text-sub: #a0a0a0;
      --border-color: #333333;
      --hover-bg: #2a2a2a;
      --primary: #4fc3f7;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; transition: background 0.3s, color 0.3s; }
    
    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 16px;
    }

    main {
      max-width: 960px;
      margin: auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 24px;
    }

    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; color: var(--primary); font-size: 1.5rem; }
    
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      background: var(--hover-bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .search-bar {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #102f59;
      color: #fff;
    }
    
    body.dark-mode .btn { background: #4fc3f7; color: #121212; }

    .users-list { display: grid; gap: 12px; }
    
    .user-row {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.4s ease-in-out;
    }
    
    .user-row:hover { background: var(--hover-bg); transform: translateY(-2px); transition: 0.2s; }

    .user-info { display: flex; align-items: center; gap: 12px; }
    
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .user-details strong { display: block; color: var(--text-main); }
    .user-details small { color: var(--text-sub); }

    .status-dot {
      width: 12px; height: 12px; border-radius: 50%; display: inline-block;
    }
    .status-active { background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.14); }
    .status-idle { background: #facc15; box-shadow: 0 0 0 3px rgba(250,204,21,.14); }
    .status-offline { background: #9ca3af; box-shadow: 0 0 0 3px rgba(156,163,175,.14); }

    .time-badge {
      background: var(--hover-bg);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { .user-row { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <main>
    <div class="header-section">
      <h1>المستخدمون النشطون <span id="userCount">(0)</span></h1>
      <button class="btn" id="darkModeToggle">الوضع الليلي 🌙</button>
    </div>
    
    <div class="toolbar">
      <input type="text" id="searchInput" class="search-bar" placeholder="ابحث بالاسم أو الإيميل..." />
    </div>

    <div class="users-list" id="usersList">
      <div style="padding: 20px; text-align: center; color: var(--text-sub);">جارٍ تحميل الحضور...</div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAA-iRIXpM_xkN3btGyr7elW8mwiuDbTLo",
      authDomain: "wallet-tamer-adel.firebaseapp.com",
      projectId: "wallet-tamer-adel",
      storageBucket: "wallet-tamer-adel.firebasestorage.app",
      messagingSenderId: "51007948250",
      appId: "1:51007948250:web:e1f6eaaebb4202b8aface3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let globalUsers = []; 
    const usersList = document.getElementById("usersList");
    const searchInput = document.getElementById("searchInput");
    const countBadge = document.getElementById("userCount");

    // ميزة الوضع الليلي
    document.getElementById("darkModeToggle").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    // دالة لحساب الوقت وتحديد حالة الاتصال (نشط/خامل)
    function analyzeTime(value) {
      try {
        const date = value?.toDate ? value.toDate() : new Date(value);
        if (!date || Number.isNaN(date.getTime())) return { text: "غير معروف", statusClass: "status-offline" };
        
        const diffSeconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
        let statusClass = "status-active"; // أخضر
        
        if (diffSeconds > 300) statusClass = "status-idle"; // أصفر إذا مر أكثر من 5 دقائق
        if (diffSeconds > 3600) statusClass = "status-offline"; // رمادي إذا مر أكثر من ساعة

        if (diffSeconds < 60) return { text: `منذ ${diffSeconds} ثواني`, statusClass };
        const mins = Math.floor(diffSeconds / 60);
        if (mins < 60) return { text: `منذ ${mins} دقيقة`, statusClass };
        const hours = Math.floor(mins / 60);
        return { text: `منذ ${hours} ساعة`, statusClass };
      } catch {
        return { text: "غير معروف", statusClass: "status-offline" };
      }
    }

    // دالة الرسم (Render)
    function renderUsers(users) {
      countBadge.innerText = `(${users.length})`;
      if (!users.length) {
        usersList.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-sub);">لا توجد نتائج مطابقة.</div>`;
        return;
      }

      usersList.innerHTML = users.map((user) => {
        const timeData = analyzeTime(user.lastSeenAt);
        const firstLetter = (user.name || "م").charAt(0).toUpperCase();
        
        return `
          <div class="user-row">
            <div class="user-info">
              <div class="avatar">${firstLetter}</div>
              <div class="user-details">
                <strong>
                  <span class="status-dot ${timeData.statusClass}"></span>
                  ${user.name || "مستخدم غير معروف"}
                </strong>
                <small>${user.email || "لا يوجد إيميل"}</small>
              </div>
            </div>
            <div class="time-badge">
              آخر نشاط: ${timeData.text}
            </div>
          </div>
        `;
      }).join("");
    }

    // ميزة البحث السريع
    searchInput.addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = globalUsers.filter(u => 
        (u.name && u.name.toLowerCase().includes(term)) || 
        (u.email && u.email.toLowerCase().includes(term))
      );
      renderUsers(filtered);
    });

    onSnapshot(collection(db, "dashboardPresence"), (snapshot) => {
      const rawUsers = snapshot.docs
        .map((item) => ({ id: item.id, ...item.data() }))
        .filter((item) => item.online !== false);

      // ميزة: منع التكرار (Deduplication) بناءً على الإيميل
      const uniqueUsersMap = {};
      rawUsers.forEach(user => {
        const key = user.email || user.id; // نستخدم الإيميل كمفتاح لضمان عدم تكراره
        const currentUserTime = user.lastSeenAt?.seconds || 0;
        const storedUserTime = uniqueUsersMap[key]?.lastSeenAt?.seconds || 0;
        
        // إذا كان المستخدم غير موجود في القائمة، أو هذا السجل أحدث من السجل المحفوظ
        if (!uniqueUsersMap[key] || currentUserTime > storedUserTime) {
          uniqueUsersMap[key] = user;
        }
      });

      // تحويل الكائن إلى مصفوفة وترتيبها من الأحدث للأقدم
      globalUsers = Object.values(uniqueUsersMap)
        .sort((a, b) => (b.lastSeenAt?.seconds || 0) - (a.lastSeenAt?.seconds || 0));

      // إعادة تفعيل فلتر البحث الحالي إن وجد
      const term = searchInput.value.toLowerCase();
      if (term) {
        const filtered = globalUsers.filter(u => 
          (u.name && u.name.toLowerCase().includes(term)) || 
          (u.email && u.email.toLowerCase().includes(term))
        );
        renderUsers(filtered);
      } else {
        renderUsers(globalUsers);
      }
    }, (error) => {
      console.error("تعذر تحميل الحضور:", error);
      usersList.innerHTML = `<div style="padding: 20px; text-align: center; color: red;">تعذر تحميل البيانات، تأكد من الاتصال.</div>`;
    });
  </script>
</body>
</html>
