<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المقالات | Preventa Plus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary: #146c4d;
            --secondary: #143b32;
            --bg: #f4f7f6;
            --text: #1b2a2a;
            --card-bg: #ffffff;
            --border: #d7e3de;
            --muted: #6c7f7a;
            --danger: #d94a4a;
            --warning: #dca93a;
            --success: #1f8f60;
            --shadow: 0 14px 36px rgba(20, 108, 77, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: linear-gradient(180deg, #edf5f1 0%, #f7faf8 100%);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }

        .container {
            width: min(1200px, calc(100% - 32px));
            margin: 30px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h2, h3 {
            margin: 0 0 18px;
            color: var(--secondary);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .toolbar .title-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar .title-block i {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(20, 108, 77, 0.08);
            color: var(--primary);
        }

        .form-card {
            background: #f7faf8;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 18px;
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            gap: 18px;
        }

        .form-group {
            display: grid;
            gap: 8px;
        }

        label {
            font-weight: 700;
            color: var(--secondary);
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            color: var(--text);
            font: inherit;
            resize: vertical;
        }

        textarea {
            min-height: 220px;
            line-height: 1.8;
        }

        .button-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 12px 18px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover { transform: translateY(-1px); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #1d8b64);
            color: white;
        }

        .btn-secondary {
            background: #dfeae5;
            color: var(--secondary);
            display: none;
        }

        .btn-danger {
            background: #fbe6e6;
            color: var(--danger);
        }

        .btn-toggle {
            background: #eaf6f1;
            color: var(--success);
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 780px;
        }

        th, td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #f3f8f5;
            color: var(--secondary);
            font-weight: 800;
        }

        img {
            display: block;
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            margin: 0 auto;
            border: 1px solid var(--border);
            background: #eef4f2;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .status-visible {
            background: rgba(31, 143, 96, 0.12);
            color: var(--success);
        }

        .status-hidden {
            background: rgba(108, 127, 122, 0.12);
            color: var(--muted);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty-state {
            padding: 34px 20px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }
            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }
            .button-row {
                width: 100%;
            }
            .button-row button {
                flex: 1 1 calc(50% - 8px);
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="toolbar">
            <div class="title-block">
                <i class="fa-solid fa-newspaper"></i>
                <div>
                    <h2 id="formTitle">إضافة مقال جديد</h2>
                </div>
            </div>
        </header>

        <section class="form-card">
            <form id="articleForm">
                <input type="hidden" id="articleId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="articleTitle">عنوان المقال</label>
                        <input id="articleTitle" type="text" placeholder="اكتب عنوان المقال" required>
                    </div>

                    <div class="form-group">
                        <label for="articleImage">اختر صورة المقال من الملفات</label>
                        <input id="articleImage" type="file" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label for="articleSummary">وصف مختصر يظهر خارج المقال (اختياري)</label>
                        <textarea id="articleSummary" placeholder="اكتب وصفًا موجزًا يبرز في بطاقات المقالات، مثال: مقدمة قصيرة توضح فكرة المقال."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="articleDescription">نص المقال الكامل الذي يظهر داخل المقال</label>
                        <div class="button-row" style="margin-bottom: 10px;">
                            <input id="descriptionImageInput" type="file" accept="image/*" multiple style="display: none;">
                            <button class="btn-secondary" id="addDescriptionImageBtn" type="button" style="display: inline-flex; background: #eaf6f1; color: var(--success);">إضافة صور من الجهاز</button>
                        </div>
                        <textarea id="articleDescription" placeholder="اكتب النص الكامل للمقال الذي سيظهر داخل الصفحة. يمكنك إضافة صور من جهازك في هذا النص." required></textarea>
                    </div>

                    <div class="button-row">
                        <button class="btn-primary" id="submitBtn" type="submit">نشر المقال</button>
                        <button class="btn-secondary" id="cancelEditBtn" type="button">إلغاء التعديل</button>
                    </div>
                </div>
            </form>
        </section>

        <section>
            <h3>إدارة المقالات الحالية</h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>العنوان</th>
                            <th>الحالة</th>
                            <th>تاريخ النشر</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="articlesTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAA-iRIXpM_xkN3btGyr7elW8mwiuDbTLo",
            authDomain: "wallet-tamer-adel.firebaseapp.com",
            projectId: "wallet-tamer-adel",
            storageBucket: "wallet-tamer-adel.firebasestorage.app",
            messagingSenderId: "51007948250",
            appId: "1:51007948250:web:e1f6eaaebb4202b8aface3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const articleForm = document.getElementById("articleForm");
        const articleIdInput = document.getElementById("articleId");
        const articleTitleInput = document.getElementById("articleTitle");
        const articleImageInput = document.getElementById("articleImage");
        const articleSummaryInput = document.getElementById("articleSummary");
        const descriptionImageInput = document.getElementById("descriptionImageInput");
        const addDescriptionImageBtn = document.getElementById("addDescriptionImageBtn");
        const articleDescriptionInput = document.getElementById("articleDescription");
        const submitBtn = document.getElementById("submitBtn");
        const cancelEditBtn = document.getElementById("cancelEditBtn");
        const formTitle = document.getElementById("formTitle");
        const articlesTableBody = document.getElementById("articlesTableBody");

        let articleArray = [];

        function resetForm() {
            articleForm.reset();
            articleIdInput.value = "";
            articleImageInput.value = "";
            articleSummaryInput.value = "";
            formTitle.textContent = "إضافة مقال جديد";
            submitBtn.textContent = "نشر المقال";
            cancelEditBtn.style.display = "none";
        }

        function readArticleImageAsDataUrl(file) {
            if (!file) return "";

            return new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();

                img.onload = () => {
                    try {
                        const maxWidth = 1280;
                        const scale = Math.min(1, maxWidth / img.width);
                        const canvas = document.createElement("canvas");
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));

                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        let quality = 0.82;
                        let dataUrl = canvas.toDataURL("image/jpeg", quality);

                        while (dataUrl.length > 900000 && quality > 0.3) {
                            quality -= 0.08;
                            dataUrl = canvas.toDataURL("image/jpeg", quality);
                        }

                        URL.revokeObjectURL(objectUrl);
                        resolve(dataUrl);
                    } catch (error) {
                        URL.revokeObjectURL(objectUrl);
                        reject(error);
                    }
                };

                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error("تعذر قراءة الصورة المحددة."));
                };

                img.src = objectUrl;
            });
        }

        function insertHtmlAtCursor(textarea, html) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const currentValue = textarea.value;
            const nextValue = currentValue.slice(0, start) + html + currentValue.slice(end);
            textarea.value = nextValue;
            const cursorPosition = start + html.length;
            textarea.selectionStart = cursorPosition;
            textarea.selectionEnd = cursorPosition;
            textarea.focus();
        }

        function formatDate(value) {
            const date = value?.toDate ? value.toDate() : new Date(value || Date.now());
            if (Number.isNaN(date.getTime())) return "الآن";
            return new Intl.DateTimeFormat("ar-EG", {
                year: "numeric",
                month: "short",
                day: "numeric"
            }).format(date);
        }

        function renderTable(snapshot) {
            if (!articlesTableBody) return;
            articlesTableBody.innerHTML = "";
            articleArray = [];

            if (snapshot.empty) {
                articlesTableBody.innerHTML = '<tr><td colspan="5" class="empty-state">لا توجد مقالات مضافة حتى الآن.</td></tr>';
                return;
            }

            snapshot.forEach((docSnapshot) => {
                const data = docSnapshot.data();
                const id = docSnapshot.id;
                articleArray.push({ id, ...data });

                const isVisible = data.isVisible !== false;
                const statusBadge = isVisible
                    ? '<span class="status-badge status-visible">ظاهر</span>'
                    : '<span class="status-badge status-hidden">مخفي</span>';

                const toggleText = isVisible ? "إخفاء" : "إظهار";
                const imageUrl = data.imageUrl || "6384.png";
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td><img src="${imageUrl}" alt="${data.title || "مقال"}"></td>
                    <td>${data.title || "مقال بدون عنوان"}</td>
                    <td>${statusBadge}</td>
                    <td>${formatDate(data.createdAt)}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-toggle" type="button" data-id="${id}" data-status="${isVisible}">${toggleText}</button>
                            <button class="btn-secondary" type="button" data-id="${id}" style="display:inline-flex; background:#fff7d9; color:#8a6212;">تعديل</button>
                            <button class="btn-danger" type="button" data-id="${id}">حذف</button>
                        </div>
                    </td>
                `;

                articlesTableBody.appendChild(row);
            });
        }

        onSnapshot(query(collection(db, "articles"), orderBy("createdAt", "desc")), (snapshot) => {
            renderTable(snapshot);
        }, (error) => {
            console.error("تعذر تحميل المقالات:", error);
            articlesTableBody.innerHTML = '<tr><td colspan="5" class="empty-state">تعذر تحميل المقالات في الوقت الحالي.</td></tr>';
        });

        articleForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            submitBtn.textContent = "جاري الحفظ...";
            submitBtn.disabled = true;

            const id = articleIdInput.value;
            const selectedFile = articleImageInput.files?.[0] || null;
            const existingArticle = articleArray.find((item) => item.id === id) || null;

            if (!id && !selectedFile) {
                alert("يرجى اختيار صورة المقال من الملفات أولاً.");
                submitBtn.textContent = "نشر المقال";
                submitBtn.disabled = false;
                return;
            }

            try {
                let imageUrl = existingArticle?.imageUrl || "";

                if (selectedFile) {
                    imageUrl = await readArticleImageAsDataUrl(selectedFile);
                }

                const articleData = {
                    title: articleTitleInput.value.trim(),
                    imageUrl,
                    summary: articleSummaryInput.value.trim(),
                    description: articleDescriptionInput.value.trim(),
                    isVisible: true
                };

                if (id) {
                    await updateDoc(doc(db, "articles", id), {
                        title: articleData.title,
                        imageUrl: articleData.imageUrl,
                        summary: articleData.summary,
                        description: articleData.description
                    });
                    alert("تم تحديث المقال بنجاح.");
                } else {
                    await addDoc(collection(db, "articles"), {
                        ...articleData,
                        createdAt: serverTimestamp()
                    });
                    alert("تم إضافة المقال بنجاح.");
                }
                resetForm();
            } catch (error) {
                console.error("خطأ أثناء حفظ المقال:", error);
                alert("حدث خطأ أثناء حفظ المقال. حاول مرة أخرى.");
            } finally {
                submitBtn.textContent = "نشر المقال";
                submitBtn.disabled = false;
            }
        });

        articlesTableBody.addEventListener("click", async (event) => {
            const button = event.target.closest("button");
            if (!button) return;

            const id = button.dataset.id;
            if (!id) return;

            if (button.classList.contains("btn-toggle")) {
                const currentStatus = button.dataset.status === "true";
                try {
                    await updateDoc(doc(db, "articles", id), { isVisible: !currentStatus });
                } catch (error) {
                    console.error("خطأ أثناء تغيير حالة المقال:", error);
                    alert("تعذر تغيير حالة المقال.");
                }
                return;
            }

            if (button.classList.contains("btn-danger")) {
                const confirmed = window.confirm("هل أنت متأكد من حذف هذا المقال؟");
                if (!confirmed) return;
                try {
                    await deleteDoc(doc(db, "articles", id));
                } catch (error) {
                    console.error("خطأ أثناء حذف المقال:", error);
                    alert("تعذر حذف المقال.");
                }
                return;
            }

            if (button.classList.contains("btn-secondary")) {
                const article = articleArray.find((item) => item.id === id);
                if (!article) return;
                articleIdInput.value = article.id;
                articleTitleInput.value = article.title || "";
                articleImageInput.value = "";
                articleSummaryInput.value = article.summary || "";
                articleDescriptionInput.value = article.description || "";
                formTitle.textContent = "تعديل المقال الحالي";
                submitBtn.textContent = "حفظ التعديلات";
                cancelEditBtn.style.display = "inline-flex";
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        });

        addDescriptionImageBtn.addEventListener("click", () => {
            descriptionImageInput.click();
        });

        descriptionImageInput.addEventListener("change", async (event) => {
            const files = Array.from(event.target.files || []).filter((file) => file.type.startsWith("image/"));
            if (!files.length) {
                descriptionImageInput.value = "";
                return;
            }

            addDescriptionImageBtn.disabled = true;
            addDescriptionImageBtn.textContent = "جاري إضافة الصور...";

            try {
                const htmlFragments = [];
                for (const file of files) {
                    const dataUrl = await readArticleImageAsDataUrl(file);
                    const safeName = (file.name || "image").replace(/[<>]/g, "").slice(0, 80);
                    htmlFragments.push(`<p><img src="${dataUrl}" alt="${safeName}" style="max-width:100%;height:auto;border-radius:12px;margin:12px 0;display:block;" /></p>`);
                }

                if (htmlFragments.length) {
                    insertHtmlAtCursor(articleDescriptionInput, `${htmlFragments.join("\n")}\n`);
                }
            } catch (error) {
                console.error("خطأ أثناء إضافة صور الوصف:", error);
                alert("تعذر إضافة الصور المحددة. حاول مرة أخرى.");
            } finally {
                descriptionImageInput.value = "";
                addDescriptionImageBtn.disabled = false;
                addDescriptionImageBtn.textContent = "إضافة صور من الجهاز";
            }
        });

        cancelEditBtn.addEventListener("click", resetForm);
    </script>
</body>
</html>
