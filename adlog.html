<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الإدارة الآمن | Preventa Plus</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg-color: #050b14; 
      --panel-bg: #0a1526;
      --primary: #00ff88; 
      --primary-dim: rgba(0, 255, 136, 0.2);
      --text: #e0f2fe; 
      --muted: #64748b; 
      --danger: #ff3366;
      --border: #1e293b;
    }
    
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      min-height: 100vh; 
      display: grid; 
      place-items: center; 
      padding: 24px; 
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      font-family: 'Cairo', sans-serif; 
      color: var(--text); 
    }

    .shell { 
      width: min(100%, 450px); 
      background: var(--panel-bg); 
      border: 1px solid var(--border); 
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px var(--primary-dim); 
      border-radius: 12px; 
      overflow: hidden;
      position: relative;
    }

    /* شريط علوي يوحي بالأنظمة المشفرة */
    .shell::before {
      content: "ENCRYPTED CONNECTION // SECURE_PORT: 443";
      display: block;
      background: #000;
      color: var(--primary);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 1px;
    }

    .form-area { padding: 40px; }
    
    .icon-lock {
      font-size: 40px;
      text-align: center;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 10px var(--primary));
    }

    h2 { 
      margin: 0 0 8px; 
      font-size: 1.6rem; 
      text-align: center; 
      color: #fff;
    }

    .muted { 
      margin: 0 0 30px; 
      color: var(--muted); 
      text-align: center; 
      font-size: 0.9rem;
    }

    label { 
      display: block; 
      margin: 16px 0 8px; 
      font-weight: 700; 
      font-size: 0.9rem;
      color: var(--primary);
    }

    input { 
      width: 100%; 
      min-height: 48px; 
      border-radius: 6px; 
      border: 1px solid var(--border); 
      padding: 0 16px; 
      background: #030712; 
      color: #fff;
      font-family: 'Share Tech Mono', 'Cairo', monospace;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-dim);
    }

    button { 
      width: 100%; 
      min-height: 48px; 
      border-radius: 6px; 
      border: 1px solid var(--primary); 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 1rem;
      font-family: inherit;
      background: var(--primary-dim); 
      color: var(--primary); 
      margin-top: 30px; 
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover { 
      background: var(--primary); 
      color: #000;
      box-shadow: 0 0 20px var(--primary-dim);
    }

    .message { 
      min-height: 24px; 
      margin: 20px 0 0; 
      color: var(--danger); 
      font-size: 0.9rem; 
      text-align: center;
      font-weight: bold;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }
    
    .status-bar span:last-child { color: var(--primary); }
        body {
    user-select: none; 
    -webkit-user-select: none; /* لمتصفحات سفاري وكروم */
    -moz-user-select: none; /* لمتصفح فايرفوكس */
    -ms-user-select: none; /* لمتصفحات إنترنت إكسبلورر وإيدج */
}

  </style>
</head>
<body>
  <main class="shell">
    <section class="form-area" aria-labelledby="title">
      <div class="icon-lock">🔐</div>
      <h2 id="title">بوابة الإدارة المركزية</h2>
      <p class="muted">النظام مراقب. الوصول مسموح للمصرح لهم فقط.</p>
      
      <form id="admin-login-form">
        <label for="email">IDENTIFIER (Email)</label>
        <input id="email" type="email" autocomplete="username" required placeholder="admin@domain.com">
        
        <label for="password">ACCESS KEY (Password)</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        
        <button type="submit" id="login-button"> [تسجيل الدخول]</button>
      </form>
      
      <p class="message" id="message" role="alert"></p>
      
      <div class="status-bar">
        <span>SECURITY: END-TO-END 256-BIT</span>
        <span>STATUS: SECURE</span>
      </div>
    </section>
  </main>

 <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getAuth, 
        setPersistence, 
        browserLocalPersistence, 
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // إعدادات الحماية: التحقق من عدد المحاولات الخاطئة
    const MAX_ATTEMPTS = 3;
    let failedAttempts = parseInt(localStorage.getItem("admin_failed_attempts") || "0");

    // إذا تجاوز الحد، يتم طرده فوراً قبل حتى تحميل الصفحة بالكامل
    if (failedAttempts >= MAX_ATTEMPTS) {
        window.location.href = "index.html";
    }

    const firebaseConfig = { 
        apiKey: "AIzaSyAA-iRIXpM_xkN3btGyr7elW8mwiuDbTLo", 
        authDomain: "wallet-tamer-adel.firebaseapp.com", 
        projectId: "wallet-tamer-adel", 
        storageBucket: "wallet-tamer-adel.firebasestorage.app", 
        messagingSenderId: "51007948250", 
        appId: "1:51007948250:web:e1f6eaaebb4202b8aface3" 
    };
    
    const auth = getAuth(initializeApp(firebaseConfig));
    await setPersistence(auth, browserLocalPersistence);
    const db = getFirestore(auth.app);
    
    const message = document.getElementById("message");
    const form = document.getElementById("admin-login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("login-button");
    
    const showError = (text) => { message.textContent = text; };

    // دالة توجيه الأدمن بعد تسجيل الدخول
    async function routeAdmin(user) {
      if (user.email?.trim().toLowerCase() !== "tamer.adel.1981@gmail.com") {
        await signOut(auth);
        throw new Error("ACCESS DENIED: حساب غير مصرح له بالإدارة.");
      }
      
      // تصفير المحاولات عند الدخول الناجح
      localStorage.setItem("admin_failed_attempts", "0");
      
      const role = "admin";
      const destinations = { news: "fhfk6iuof.html", users: "mm6ops.html", code: "mmd458jh.html", admin: "addash.html" };
      window.location.href = destinations[role] || destinations.admin;
    }

    // دالة إتمام تسجيل الدخول
    async function finishLogin(loginPromise) {
      try { 
          loginBtn.textContent = "AUTHENTICATING...";
          loginBtn.disabled = true;
          const result = await loginPromise; 
          await routeAdmin(result.user); 
      } catch (error) { 
          // زيادة العداد عند الفشل
          failedAttempts++;
          localStorage.setItem("admin_failed_attempts", failedAttempts);
          
          if (failedAttempts >= MAX_ATTEMPTS) {
              showError("🚨 تم تجاوز الحد الأقصى للمحاولات. جاري طردك من النظام...");
              setTimeout(() => {
                  window.location.href = "index.html";
              }, 2000); // طرد بعد ثانيتين
          } else {
              const attemptsLeft = MAX_ATTEMPTS - failedAttempts;
              showError(`خطأ في المصادقة. تبقى لك (${attemptsLeft}) محاولات قبل الحظر.`);
          }
      } finally {
          if(failedAttempts < MAX_ATTEMPTS) {
              loginBtn.textContent = "Authenticate [تسجيل الدخول]";
              loginBtn.disabled = false;
          }
      }
    }

    // التنفيذ عند الإرسال
    form.addEventListener("submit", (event) => { 
        event.preventDefault(); 
        if (failedAttempts >= MAX_ATTEMPTS) return; // منع المحاولة إذا كان محظوراً
        finishLogin(signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value)); 
    });

</script>
</body>
</html>
