<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإدارة المركزية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg-color: #050b14; 
      --panel-bg: #0a1526;
      --primary: #00ff88; 
      --primary-dim: rgba(0, 255, 136, 0.2);
      --text: #e0f2fe; 
      --muted: #64748b; 
      --danger: #ff3366;
      --border: #1e293b;
    }
    
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      min-height: 100vh; 
      display: grid; 
      place-items: center; 
      padding: 24px; 
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      font-family: 'Cairo', sans-serif; 
      color: var(--text); 
    }
    body {
    user-select: none; 
    -webkit-user-select: none; /* لمتصفحات سفاري وكروم */
    -moz-user-select: none; /* لمتصفح فايرفوكس */
    -ms-user-select: none; /* لمتصفحات إنترنت إكسبلورر وإيدج */
}

    .shell { 
      width: min(100%, 450px); 
      background: var(--panel-bg); 
      border: 1px solid var(--border); 
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px var(--primary-dim); 
      border-radius: 12px; 
      overflow: hidden;
      position: relative;
    }

    /* شريط علوي يوحي بالأنظمة المشفرة */
    .shell::before {
      content: "ENCRYPTED CONNECTION // SECURE_PORT: 443";
      display: block;
      background: #000;
      color: var(--primary);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 1px;
    }

    .form-area { padding: 40px; }
    
    .icon-lock {
      font-size: 40px;
      text-align: center;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 10px var(--primary));
    }

    h2 { 
      margin: 0 0 8px; 
      font-size: 1.6rem; 
      text-align: center; 
      color: #fff;
    }

    .muted { 
      margin: 0 0 30px; 
      color: var(--muted); 
      text-align: center; 
      font-size: 0.9rem;
    }

    label { 
      display: block; 
      margin: 16px 0 8px; 
      font-weight: 700; 
      font-size: 0.9rem;
      color: var(--primary);
    }

    input { 
      width: 100%; 
      min-height: 48px; 
      border-radius: 6px; 
      border: 1px solid var(--border); 
      padding: 0 16px; 
      background: #030712; 
      color: #fff;
      font-family: 'Share Tech Mono', 'Cairo', monospace;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-dim);
    }

    button { 
      width: 100%; 
      min-height: 48px; 
      border-radius: 6px; 
      border: 1px solid var(--primary); 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 1rem;
      font-family: inherit;
      background: var(--primary-dim); 
      color: var(--primary); 
      margin-top: 30px; 
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover { 
      background: var(--primary); 
      color: #000;
      box-shadow: 0 0 20px var(--primary-dim);
    }

    .message { 
      min-height: 24px; 
      margin: 20px 0 0; 
      color: var(--danger); 
      font-size: 0.9rem; 
      text-align: center;
      font-weight: bold;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .status-bar span:last-child { color: var(--primary); }
  </style>
</head>
<body>
  <main class="shell">
    <section class="form-area" aria-labelledby="title">
      <div class="icon-lock">🔐</div>
      <h2 id="title">بوابة الإدارة المركزية</h2>
      <p class="muted">النظام مراقب. الوصول مسموح للمصرح لهم فقط.</p>
      <form id="admin-login-form">
        <label for="email">IDENTIFIER (Email)</label>
        <input id="email" type="email" autocomplete="username" required placeholder="admin@domain.com">
        <label for="password">ACCESS KEY (Password)</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        <button type="submit" id="login-button">[تسجيل الدخول]</button>
      </form>
      <p class="message" id="message" role="alert"></p>
      <div class="status-bar">
        <span>SECURITY: END-TO-END 256-BIT</span>
        <span>STATUS: SECURE</span>
      </div>
    </section>
