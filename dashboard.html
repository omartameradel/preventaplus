<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>لوحة التحكم | Preventa Plus</title>
	<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<script src="https://meet.jit.si/external_api.js"></script>
	<style>
		:root {
			--navy: #102f59;
			--blue: #1b6ca8;
			--cyan: #e9f7fb;
			--ink: #183047;
			--muted: #6d7d8c;
			--line: #dbe7ed;
			--surface: #ffffff;
			--background: #f4f8fa;
			--danger: #b83232;
			--gold: #e6a93a;
			--mint: #5dc9bd;
			--shadow-soft: 0 24px 60px rgba(16, 47, 89, .12);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			background: radial-gradient(circle at 12% 8%, rgba(93, 201, 189, .18), transparent 26%), radial-gradient(circle at 87% 92%, rgba(230, 169, 58, .12), transparent 24%), var(--background);
			color: var(--ink);
			font-family: "Tajawal", "Trebuchet MS", Tahoma, Arial, sans-serif;
		}
		body.sidebar-open { overflow: hidden; }
		body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .34; background-image: linear-gradient(rgba(16, 47, 89, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(16, 47, 89, .035) 1px, transparent 1px); background-size: 32px 32px; }

		body.is-loading #app { display: none; }

		#authLoading {
			min-height: 100vh;
			display: grid;
			place-items: center;
			color: var(--navy);
			font-size: 1.1rem;
		}

		body:not(.is-loading) #authLoading { display: none; }

		.app-shell { position: relative; min-height: 100vh; display: flex; animation: pageEnter .65s ease both; }
		.mobile-sidebar-overlay {
			position: fixed;
			inset: 0;
			z-index: 45;
			background: rgba(8, 29, 54, .38);
			opacity: 0;
			pointer-events: none;
			transition: opacity .22s ease;
		}
	.app-shell.sidebar-open .mobile-sidebar-overlay {
    opacity: 1;
    pointer-events: auto;
}

		.sidebar {
			position: sticky;
			top: 14px;
			width: 285px;
			flex: 0 0 285px;
			height: calc(100vh - 28px);
			min-height: 620px;
			padding: 30px 18px;
			border-radius: 28px;
			background: linear-gradient(165deg, #102f59 0%, #123e6b 62%, #0d294b 100%);
			color: #fff;
			box-shadow: -10px 0 36px rgba(16, 47, 89, .2);
			overflow-y: auto;
			overflow-x: hidden;
			transition: width .3s ease, flex-basis .3s ease, padding .3s ease, opacity .2s ease, margin .3s ease, transform .22s ease;
			z-index: 50;
		}
		.app-shell.sidebar-collapsed .sidebar {
			width: 92px;
			flex-basis: 92px;
			padding: 22px 10px;
			margin: 0;
			opacity: 1;
			pointer-events: auto;
		}
		.app-shell.sidebar-collapsed .main-content { max-width: none; }
		.sidebar::before { content: ""; position: absolute; top: -90px; left: -110px; width: 250px; height: 250px; border: 1px solid rgba(93, 201, 189, .28); border-radius: 50%; box-shadow: 0 0 0 22px rgba(93, 201, 189, .04), 0 0 0 44px rgba(93, 201, 189, .035); }
		.sidebar > * { position: relative; z-index: 1; }

		.brand { display: flex; align-items: center; justify-content: space-between; gap: 11px; padding: 0 14px 28px; border-bottom: 1px solid rgba(255,255,255,.16); }
		.brand-content { display: flex; align-items: center; gap: 11px; min-width: 0; }
		.brand img { width: 48px; height: 48px; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,.18)); }
		.brand-copy { min-width: 0; }
		.brand strong { display: block; color: #fff; font-size: 1.18rem; letter-spacing: .2px; white-space: nowrap; }
		.brand span { display: block; margin-top: 7px; color: #b7d9e8; font-size: .82rem; }

		.side-nav { display: grid; gap: 7px; margin-top: 26px; }
		.nav-button, .library-toggle {
			width: 100%;
			border: 0;
			border-radius: 11px;
			padding: 13px 15px;
			background: transparent;
			color: #eaf6fa;
			cursor: pointer;
			font: inherit;
			text-align: right;
			display: flex;
			align-items: center;
			gap: 10px;
			touch-action: manipulation;
			transition: background .2s ease, transform .2s ease, color .2s ease, padding .2s ease;
		}
		.nav-button:hover, .library-toggle:hover { background: rgba(255,255,255,.1); padding-right: 19px; }
		.nav-button.active { background: linear-gradient(90deg, rgba(93, 201, 189, .22), rgba(255,255,255,.12)); color: #fff; box-shadow: inset -3px 0 var(--gold); }
		.nav-button:active, .library-toggle:active { transform: translateY(1px); }
		.nav-label { display: inline-block; min-width: 0; }
		.library-toggle { display: flex; align-items: center; justify-content: space-between; }
		.library-toggle .arrow { position: relative; display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid rgba(230, 169, 58, .65); border-radius: 50%; background: rgba(230, 169, 58, .12); color: var(--gold); font-size: 0; transition: transform .28s ease, background .28s ease, border-color .28s ease; }
		.library-toggle .arrow::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); transition: transform .28s ease; }
		.library-toggle.open .arrow { background: var(--gold); border-color: var(--gold); color: var(--navy); }
		.library-toggle.open .arrow::after { transform: rotate(225deg) translate(-2px, -2px); }
		.library-toggle.open .arrow { transform: rotate(180deg); }
		.library-items { display: none; gap: 5px; margin: 0 9px 5px 0; padding-right: 12px; border-right: 1px solid rgba(183,217,232,.45); }
		.library-items.open { display: grid; }
		.library-items .nav-button { position: relative; padding: 11px 12px 11px 8px; color: #cbe4ed; font-size: .88rem; }
		.app-shell.sidebar-collapsed .brand { padding: 0 8px 18px; }
		.app-shell.sidebar-collapsed .brand-copy,
		.app-shell.sidebar-collapsed .nav-label,
		.app-shell.sidebar-collapsed .library-toggle .nav-label,
		.app-shell.sidebar-collapsed .library-loading,
		.app-shell.sidebar-collapsed .user-label,
		.app-shell.sidebar-collapsed .sidebar-footer .logout .nav-label {
			display: none;
		}
		.app-shell.sidebar-collapsed .side-nav,
		.app-shell.sidebar-collapsed .library-items,
		.app-shell.sidebar-collapsed .sidebar-footer {
			gap: 8px;
		}
		.app-shell.sidebar-collapsed .nav-button,
		.app-shell.sidebar-collapsed .library-toggle,
		.app-shell.sidebar-collapsed .logout {
			justify-content: center;
			padding: 12px 8px;
		}
		.app-shell.sidebar-collapsed .nav-button:hover, .app-shell.sidebar-collapsed .library-toggle:hover {
			padding-right: 8px;
		}
		.app-shell.sidebar-collapsed .library-items {
			margin: 0;
			padding-right: 0;
			border-right: 0;
		}
		.app-shell.sidebar-collapsed .library-toggle .arrow {
			display: none;
		}
		.app-shell.sidebar-collapsed .library-items .nav-button {
			padding: 10px 8px;
		}
		.library-items .nav-button::before { content: attr(data-number); display: inline-grid; place-items: center; width: 21px; height: 21px; margin-left: 8px; border: 1px solid rgba(183,217,232,.35); border-radius: 50%; color: #9dc9d8; font-size: .7rem; }
		.library-items .nav-button.active { color: #fff; background: rgba(65, 177, 205, .26); }
		.library-items .nav-button.active::before { border-color: var(--gold); background: var(--gold); color: var(--navy); }
		.library-loading { padding: 10px 12px; color: #9dc9d8; font-size: .78rem; }

		.sidebar-footer { margin-top: 42px; padding: 16px 14px 0; border-top: 1px solid rgba(255,255,255,.16); }
		.user-label { overflow: hidden; color: #c6dce6; font-size: .82rem; text-overflow: ellipsis; white-space: nowrap; }
		.logout {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			gap: 8px;
			width: 100%;
			margin-top: 12px;
			padding: 10px 10px;
			border: 0;
			border-radius: 11px;
			background: transparent;
			color: #ffb4b4;
			cursor: pointer;
			font: inherit;
		}
		.logout:hover { background: rgba(255,255,255,.08); }

		.main-content { flex: 1; min-width: 0; max-width: 1250px; padding: 18px clamp(20px, 5vw, 72px) 42px; }
		.topbar {
		position: relative;
		top: auto;
    z-index: 45; 
    
    /* تخطي الـ padding الخاص بالـ main-content ليمتد للطرفين */
    margin-top: 0;
    margin-bottom: 20px;
    margin-left: -12px; /* نفس قيمة الـ padding الجانبي للـ main-content */
    margin-right: -12px;
    width: calc(100% + 24px); /* تعويض مساحة الهوامش السلبية */
    
    padding: 10px 15px; 
    min-height: 65px;
    
    /* إزالة الزوايا الدائرية والحدود الجانبية/العلوية */
    border-radius: 0; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
    border-top: none;
    border-left: none;
    border-right: none;
    
    background: linear-gradient(135deg, #0d315c 0%, #174b79 68%, #1a6688 100%);
    box-shadow: 0 14px 30px rgba(16,47,89,.24), inset 0 -1px 0 rgba(255,255,255,.16);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: 8px;
}
		.topbar-right, .topbar-left { display: flex; align-items: center; gap: 14px; }
		.topbar-right { min-width: 0; }
		.topbar-left { flex-wrap: wrap; justify-content: flex-start; }

		.topbar-heading h1 { margin: 0; color: #fff; font-size: clamp(1.25rem, 2.5vw, 1.8rem); letter-spacing: 0; }
		.welcome { margin: 4px 0 0; color: #b7d9e8; font-size: .8rem; }
		.status { padding: 9px 14px; border: 1px solid rgba(93, 201, 189, .35); border-radius: 20px; background: rgba(239, 250, 248, .82); color: #217568; font-size: .82rem; font-weight: bold; white-space: nowrap; box-shadow: 0 8px 18px rgba(33, 117, 104, .08); }

		.content-panel { position: relative; min-height: 430px; overflow: hidden; padding: clamp(22px, 4vw, 46px); border: 1px solid rgba(219, 231, 237, .88); border-radius: 22px; background: rgba(255, 255, 255, .86); box-shadow: var(--shadow-soft); backdrop-filter: blur(12px); }
		.content-panel::after { content: ""; position: absolute; left: -65px; bottom: -75px; width: 220px; height: 220px; border: 25px solid rgba(65, 177, 205, .08); border-radius: 50%; }
		.content-panel h2 { margin: 0 0 10px; color: var(--navy); font-size: clamp(1.5rem, 3vw, 2.15rem); }
		.content-panel p { max-width: 680px; margin: 0; color: var(--muted); line-height: 1.9; }
		.panel-heading { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 17px; }
		.panel-icon { display: grid; flex: 0 0 62px; place-items: center; width: 62px; height: 62px; border: 1px solid rgba(93, 201, 189, .3); border-radius: 18px; background: linear-gradient(145deg, var(--navy), #1d7392); color: #fff; font-size: 1.7rem; box-shadow: 7px 7px 0 rgba(230, 169, 58, .75); }
		.panel-tag { display: inline-block; margin-bottom: 11px; padding: 5px 10px; border-radius: 5px; background: var(--cyan); color: var(--blue); font-size: .75rem; font-weight: bold; }
		.panel-tools { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(190px, .7fr); gap: 16px; margin-top: 38px; }
		.feature-card { position: relative; min-height: 145px; padding: 24px; border-radius: 16px; background: linear-gradient(135deg, var(--navy), #1c6d91); color: #fff; box-shadow: 0 15px 25px rgba(16, 47, 89, .16); overflow: hidden; }
		.feature-card::after { content: "✦"; position: absolute; left: 22px; bottom: 6px; color: rgba(255,255,255,.16); font-size: 4rem; }
		.feature-card strong { display: block; margin-bottom: 10px; color: #fff; font-size: 1.12rem; }
		.feature-card span { color: #c7e5ed; font-size: .88rem; line-height: 1.8; }
		.stat-card { display: flex; flex-direction: column; justify-content: space-between; min-height: 145px; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(145deg, #fff, #f1fafb); box-shadow: 0 10px 22px rgba(16, 47, 89, .05); }
		.stat-card span { color: var(--muted); font-size: .82rem; }
		.stat-card strong { color: var(--blue); font-size: 2rem; }
		.quick-actions { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 30px; }
		.quick-actions button { display: flex; align-items: center; justify-content: space-between; min-height: 82px; padding: 15px 17px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--navy); cursor: pointer; font: inherit; font-weight: bold; text-align: right; box-shadow: 0 6px 16px rgba(16, 47, 89, .05); transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease; }
		.quick-actions button::after { content: "←"; color: var(--gold); font-size: 1.2rem; }
		.quick-actions button:hover { border-color: var(--blue); background: var(--cyan); transform: translateY(-4px); box-shadow: 0 12px 22px rgba(16, 47, 89, .1); }
		.empty-state { position: relative; z-index: 1; margin-top: 30px; padding: 24px; border: 1px dashed #b9ccd7; border-radius: 10px; background: #f8fbfc; color: var(--muted); }
		.primary-action { position: relative; z-index: 1; margin-top: 26px; padding: 13px 22px; border: 0; border-radius: 8px; background: var(--gold); color: var(--navy); cursor: pointer; font: inherit; font-weight: bold; }
		.tests-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 30px; }
		.test-card { display: flex; flex-direction: column; min-height: 100%; overflow: hidden; border: 1px solid rgba(219, 231, 237, .9); border-radius: 18px; background: linear-gradient(180deg, #ffffff, #f4fbff); box-shadow: 0 14px 26px rgba(16,47,89,.06); }
		.test-card img, .test-card-placeholder { display: block; width: 100%; height: 180px; background: linear-gradient(135deg, #102f59, #1d6d91); object-fit: cover; }
		.test-card-placeholder { display: grid; place-items: center; color: #fff; font-size: 1.05rem; font-weight: bold; letter-spacing: .5px; }
		.test-card-body { display: flex; flex: 1; flex-direction: column; padding: 18px; }
		.test-card h3 { margin: 0; color: var(--navy); font-size: 1.12rem; }
		.test-card p { margin: 10px 0 0; color: var(--muted); line-height: 1.8; font-size: .86rem; }
		.test-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
		.test-meta span { padding: 6px 10px; border: 1px solid rgba(93, 201, 189, .3); border-radius: 999px; background: rgba(93, 201, 189, .08); color: var(--blue); font-size: .72rem; font-weight: bold; }
		.test-status { margin-top: 16px; padding: 10px 12px; border: 1px solid rgba(219, 231, 237, .95); border-radius: 10px; background: #f6fbfd; color: var(--navy); font-size: .8rem; font-weight: bold; }
		.test-start-btn { margin-top: auto; padding: 12px 16px; border: 0; border-radius: 10px; background: linear-gradient(135deg, var(--blue), #125d8e); color: #fff; cursor: pointer; font: inherit; font-weight: bold; box-shadow: 0 12px 22px rgba(27,108,168,.18); }
		.test-start-btn:hover { transform: translateY(-2px); }
		.test-modal-shell { position: relative; width: min(980px, calc(100vw - 40px)); max-height: min(88vh, 900px); display: flex; flex-direction: column; padding: 20px; border-radius: 26px; background: linear-gradient(180deg, #f6fbff 0%, #edf5f7 100%); box-shadow: 0 20px 60px rgba(16,47,89,.18); }
		.test-modal-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; padding: 20px 76px 18px 20px; border: 1px solid rgba(139, 177, 191, .45); border-radius: 20px; background: linear-gradient(135deg, #ffffff, #edf8fb); box-shadow: inset 0 0 0 1px rgba(20, 92, 125, .05); }
		.test-modal-title { margin: 0; color: #102f59; font-size: clamp(1.7rem, 3vw, 2.2rem); letter-spacing: -.5px; }
		.test-modal-description { margin: 10px 0 0; color: #5f788a; font-size: 1rem; line-height: 1.8; }
		.test-modal-timer { min-width: 140px; padding: 13px 18px; border: 1px solid rgba(18, 127, 112, .15); border-radius: 18px; background: linear-gradient(135deg, #dff5ef, #ccecf6); color: #0f766e; font-size: 1.05rem; font-weight: bold; text-align: center; box-shadow: inset 0 0 0 1px rgba(18,127,112,.08); }
		#testQuestionContent { display: flex; flex-direction: column; gap: 18px; }
		.test-question-shell { display: flex; flex-direction: column; gap: 18px; }
		.test-question-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 0 0; }
		.test-question-badge { display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 999px; background: #e9f7fb; color: #1b6ca8; font-size: .8rem; font-weight: bold; }
		.test-question-help { color: #6d7d8c; font-size: .85rem; }
		.test-question-title { margin: 0; color: #102f59; line-height: 1.8; font-size: clamp(1.2rem, 2vw, 1.6rem); }
		.test-question-image { display: block; width: 100%; height: min(44vh, 440px); object-fit: cover; border: 1px solid #dbe7ed; border-radius: 22px; background: #dfeaf0; box-shadow: 0 12px 30px rgba(16,47,89,.12); }
		.test-question-options { display: grid; gap: 12px; }
		.test-option-btn { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 62px; padding: 18px; border-radius: 16px; border: 1px solid #dbe7ed; background: #fff; color: #183047; cursor: pointer; text-align: right; font: inherit; font-weight: bold; }
		.test-option-btn.active { border-color: #5dc9bd; background: #e9f7f4; box-shadow: 0 10px 24px rgba(93, 201, 189, 0.16); }
		.test-option-btn span:first-child { flex: 1; font-size: 1.05rem; line-height: 1.6; }
		.test-option-letter { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid #9fb4c0; background: #fff; color: #6d7d8c; font-size: 1rem; flex-shrink: 0; }
		.test-option-btn.active .test-option-letter { border-color: #5dc9bd; background: #5dc9bd; color: #fff; }
		.test-question-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 6px; padding-top: 14px; border-top: 1px solid #dbe7ed; }
		.test-prev-btn, .test-next-btn { padding: 12px 18px; border-radius: 12px; font: inherit; font-weight: bold; cursor: pointer; }
		.test-prev-btn { border: 1px solid #dbe7ed; background: #fff; color: #183047; }
		.test-prev-btn:disabled { opacity: .5; cursor: default; }
		.test-next-btn { border: 0; background: linear-gradient(135deg, #1b6ca8, #125a92); color: #fff; box-shadow: 0 14px 25px rgba(27,108,168,0.22); }
		
		.profile-layout { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(220px, .7fr) minmax(0, 1.3fr); gap: 22px; margin-top: 32px; }
		.profile-card, .profile-form { padding: 22px; border: 1px solid rgba(219, 231, 237, .9); border-radius: 16px; background: linear-gradient(145deg, #fff, #f8fcfd); box-shadow: 0 10px 25px rgba(16, 47, 89, .05); }
		.profile-card { text-align: center; }
		.profile-avatar { width: 128px; height: 128px; margin: 0 auto 16px; border: 5px solid #d8eef3; border-radius: 50%; background: #e9f7fb; object-fit: cover; }
		.profile-card h3 { margin: 0 0 6px; color: var(--navy); }
		.profile-card p { margin: 0 0 18px; font-size: .85rem; }
		.profile-upload { display: inline-block; padding: 10px 14px; border-radius: 7px; background: var(--navy); color: #fff; cursor: pointer; font-size: .82rem; }
		.profile-upload input { display: none; }
		.profile-form { display: grid; gap: 15px; }
		.profile-form h3 { margin: 0 0 2px; color: var(--navy); }
		.profile-field { display: grid; gap: 7px; }
		.profile-field label { color: var(--muted); font-size: .82rem; font-weight: bold; }
		.profile-field input, .profile-field select, .profile-field textarea { width: 100%; padding: 12px 14px; border: 1px solid #cfe0ea; border-radius: 12px; background: linear-gradient(180deg, #ffffff, #f9fbfd); color: var(--ink); font: inherit; transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
		.profile-field textarea { min-height: 150px; resize: vertical; line-height: 1.8; }
		.profile-field input:focus, .profile-field select:focus, .profile-field textarea:focus { border-color: #5ea6d6; outline: none; box-shadow: 0 0 0 4px rgba(94, 166, 214, .12); }
		.profile-field input:read-only { background: #edf2f4; color: #778590; cursor: not-allowed; }
		.profile-form button { justify-self: start; padding: 11px 18px; border: 0; border-radius: 7px; background: var(--blue); color: #fff; cursor: pointer; font: inherit; font-weight: bold; }

/* العرض الافتراضي للقائمة */
.sidebar {
    width: 260px;
    transition: width 0.3s ease; /* حركة ناعمة عند التصغير */
    background-color: #f8f9fa;
    height: 100vh;
}

/* ترتيب اللوجو، الاسم، والزر على نفس الخط */
.brand {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
}

.brand-content {
    display: flex;
    align-items: center;
    gap: 10px; /* المسافة بين اللوجو والاسم */
}

/* --- حالة التصغير (اختفاء اللوجو والاسم) --- */
.sidebar.collapsed {
    width: 70px; /* عرض القائمة ليناسب الأيقونات فقط */
}

/* إخفاء اللوجو والاسم بالكامل */
.sidebar.collapsed .brand-content {
    display: none;
}

/* توسيط زر القائمة عند اختفاء باقي العناصر */
.sidebar.collapsed .brand {
    justify-content: center;
}


/* =========================================
   تنسيقات الموبايل والشاشات الصغيرة
   ========================================= */

@media (max-width: 800px) {
    .app-shell { display: block; position: relative; }

/* =========================================
   تنسيقات الشاشات الكبيرة (الكمبيوتر)
   ========================================= */
.sidebar {
    width: 260px;
    transition: width 0.3s ease;
    background-color: #f8f9fa;
    height: 100vh;
}

.brand {
    display: flex;
    justify-content: space-between;

.brand-content {

.mobile-toggle {
    display: none !important;
}

/* حالة التصغير للكمبيوتر */
.sidebar.collapsed {
    width: 70px;
}
.sidebar.collapsed .brand-content {
    display: none;
}
.sidebar.collapsed .brand {
    justify-content: center;
}

/* =========================================

   ========================================= */
@media (max-width: 800px) {
    /* إخفاء زر الكمبيوتر وإظهار زر الموبايل في الهيدر */
    .desktop-toggle { display: none !important; }
    .mobile-toggle { display: flex !important; }
    
    .app-shell { display: block; position: relative; }
    
    /* إعدادات القائمة المنزلقة للموبايل */
    .sidebar {
        position: fixed; top: 0; right: 0; bottom: 0;
        width: min(82vw, 290px); height: 100vh; min-height: 100vh;
        padding: 22px 14px; border-radius: 0 0 0 24px;
        transform: translateX(110%); z-index: 100;
        transition: transform 0.3s ease; /* حركة فتح القائمة */
    }
    
    /* كلاس الفتح للموبايل (بدلاً من التصغير) */
    .app-shell.sidebar-open .sidebar { 
        transform: translateX(0); 
    }
}

		function isThisWeek(date) {
			if (!date) return false;
			const today = new Date();
			const start = new Date(today);
			start.setDate(today.getDate() - today.getDay());
			start.setHours(0, 0, 0, 0);
			const end = new Date(start);
			end.setDate(start.getDate() + 7);
			return date >= start && date < end;
		}

		function isToday(date) {
			if (!date) return false;
			const today = new Date();
			return date.toDateString() === today.toDateString();
		}

		function canUserViewLibraryFile(page, file) {
			const normalizeAllowedUsers = (values) => Array.from(new Set((Array.isArray(values) ? values : [])
				.map((value) => String(value || "").trim())
				.filter((value) => value !== "")));
			const fileAllowedUsers = normalizeAllowedUsers(file?.downloadAllowedUsers);
			const pageAllowedUsers = normalizeAllowedUsers(page?.downloadAllowedUsers);
			const hasExplicitFilePermissions = file && Object.prototype.hasOwnProperty.call(file, "downloadAllowedUsers");
			const allowedUsers = hasExplicitFilePermissions ? fileAllowedUsers : pageAllowedUsers;
			const currentUid = sessionUser?.uid;

			if (hasExplicitFilePermissions) {
				if (!allowedUsers.length) return false;
				return allowedUsers.some((value) => value === currentUid || value === activeUserData?.uid || value === activeUserData?.email || value === sessionUser?.email);
			}

			if (!allowedUsers.length) return true;
			return allowedUsers.some((value) => value === currentUid || value === activeUserData?.uid || value === activeUserData?.email || value === sessionUser?.email);
		}

				: [];
			const renderLibraryFileCard = (file, index) => {

					: type.startsWith("video/") ? `<video muted preload="metadata" src="${file.url}"></video>`
					: type.startsWith("audio/") ? `<div class="library-file-icon">♫</div>`
					: type === "application/pdf" ? `<div class="library-file-icon">PDF</div>`
					: `<div class="library-file-icon">📄</div>`;
				return `<article class="library-file"><div class="library-file-preview">${media}</div><strong>${name}</strong><small>${escapeHtml(type)} · ${formatFileSize(file.size)}</small><button type="button" data-library-file="${index}">فتح الملف</button></article>`;
			};

					</div>

				<div class="library-file-grid" id="libraryFileGrid">${visibleFiles.length ? visibleFiles.map((file, index) => renderLibraryFileCard(file, index)).join("") : `<div class="empty-state">لا توجد ملفات في هذه الصفحة بعد.</div>`}</div>`;
			const grid = document.getElementById("libraryFileGrid");
			const countNode = document.getElementById("libraryFileCount");
			const searchInput = document.getElementById("librarySearchInput");

				const term = searchInput.value.trim().toLowerCase();

		function downloadLibraryFile(file) {
			if (!file?.url) return;
			const name = file.name || "ملف المكتبة";
			fetch(file.url)
				.then((response) => {
					if (!response.ok) throw new Error("Failed to fetch file");
					return response.blob();
				})
				.then((blob) => {
					const blobUrl = URL.createObjectURL(blob);
					const link = document.createElement("a");
					link.href = blobUrl;
					link.download = name;
					link.style.display = "none";
					document.body.appendChild(link);
					link.click();
					link.remove();
					setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
				})
				.catch(() => {
					const fallback = document.createElement("a");
					fallback.href = file.url;
					fallback.download = name;
					fallback.target = "_blank";
					fallback.rel = "noopener";
					document.body.appendChild(fallback);
					fallback.click();
					fallback.remove();
				});
		}

		let activeLibraryBlobUrl = null;

		async function buildLibraryPreview(file, type, name) {
			if (type.startsWith("image/")) return `<img src="${file.url}" alt="${escapeHtml(name)}">`;
			if (type.startsWith("video/")) return `<video controls src="${file.url}"></video>`;
			if (type.startsWith("audio/")) return `<audio controls src="${file.url}"></audio>`;
			if (type === "application/pdf" || type.startsWith("text/") || type === "application/json" || type.includes("xml")) {
				try {
					if (activeLibraryBlobUrl) {
						URL.revokeObjectURL(activeLibraryBlobUrl);
						activeLibraryBlobUrl = null;
					}
					const response = await fetch(file.url);
					if (!response.ok) throw new Error("Preview fetch failed");
					const blob = await response.blob();
					activeLibraryBlobUrl = URL.createObjectURL(blob);
					return `<iframe src="${activeLibraryBlobUrl}" title="${escapeHtml(name)}"></iframe>`;
				} catch (error) {
					return `
						<div class="library-generic-preview">
							<div class="library-file-icon">📄</div>
							<div>
								<strong>${escapeHtml(name)}</strong>
								<small>${escapeHtml(type)} · ${formatFileSize(file.size)}</small>
							</div>
						</div>`;
				}
			}
			return `
				<div class="library-generic-preview">
					<div class="library-file-icon">📄</div>
					<div>
						<strong>${escapeHtml(name)}</strong>
						<small>${escapeHtml(type)} · ${formatFileSize(file.size)}</small>
					</div>
				</div>`;
		}

		async function openLibraryFile(file, page) {
			if (!file?.url) return;
			const name = file.name || "ملف المكتبة";
			const normalizedUrl = file.url || "";
			const normalizedName = name.toLowerCase();
			const inferredType = file.type && file.type !== "application/octet-stream"
				? file.type
				: (normalizedName.endsWith(".pdf") ? "application/pdf"
					: normalizedName.endsWith(".png") ? "image/png"
					: normalizedName.endsWith(".jpg") || normalizedName.endsWith(".jpeg") ? "image/jpeg"
					: normalizedName.endsWith(".webp") ? "image/webp"
					: normalizedName.endsWith(".mp4") ? "video/mp4"
					: normalizedName.endsWith(".mp3") ? "audio/mpeg"
					: normalizedName.endsWith(".wav") ? "audio/wav"
					: normalizedName.endsWith(".txt") ? "text/plain"
					: normalizedName.endsWith(".json") ? "application/json"
					: normalizedName.endsWith(".xml") ? "application/xml"
					: normalizedUrl.includes(".pdf") ? "application/pdf"
					: normalizedUrl.includes(".png") ? "image/png"
					: normalizedUrl.includes(".jpg") || normalizedUrl.includes(".jpeg") ? "image/jpeg"
					: normalizedUrl.includes(".webp") ? "image/webp"
					: normalizedUrl.includes(".mp4") ? "video/mp4"
					: normalizedUrl.includes(".mp3") ? "audio/mpeg"
					: normalizedUrl.includes(".txt") ? "text/plain"
					: normalizedUrl.includes(".json") ? "application/json"
					: normalizedUrl.includes(".xml") ? "application/xml"
					: "application/octet-stream");
			const type = inferredType;
			const preview = await buildLibraryPreview(file, type, name);
			document.getElementById("libraryModalTitle").textContent = name;
			document.getElementById("libraryModalPreview").innerHTML = preview;
			document.getElementById("libraryModalMeta").textContent = `${type} · ${formatFileSize(file.size)}`;
			const download = document.getElementById("libraryDownload");
			download.style.display = "none";
			download.textContent = "تحميل الملف";
			download.removeAttribute("href");
			download.removeAttribute("target");
			download.removeAttribute("rel");
			download.removeAttribute("download");
			download.onclick = null;
			document.getElementById("libraryModal").hidden = false;
		}

		function formatFileSize(bytes) {
			if (!bytes) return "حجم غير معروف";
			return bytes < 1024 * 1024 ? `${Math.max(1, Math.round(bytes / 1024))} KB` : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
		}

		async function renderSearch(panel) {
    panel.innerHTML = `
        <div class="panel-heading">
            <div class="panel-icon" aria-hidden="true">⌕</div>
            <div><span class="panel-tag">وصول أسرع</span><h2>ابحث في المنصة</h2><p>حدد الفئة ثم ابحث عن أي محتوى حقيقي داخل المنصة.</p></div>
        </div>
        <div class="search-page-box">
            <div class="search-controls">
                <input id="pageSearchInput" type="search" placeholder="ابحث في الأخبار والأقسام..." autocomplete="off">
                <select id="pageSearchCategory">
                    <option value="all">كل الفئات</option>
                    <option value="articles">المقالات</option>
                    <option value="news">الأخبار</option>
                    <option value="library">المكتبة</option>
                    <option value="tests">الاختبارات</option>
                    <option value="meetings">الاجتماعات</option>
                </select>
            </div>
            <div id="pageSearchResults" class="page-search-results">جاري تحميل المحتوى...</div>
        </div>`;
			const input = document.getElementById("pageSearchInput");
			const categorySelect = document.getElementById("pageSearchCategory");
			const results = document.getElementById("pageSearchResults");

			const buildResultMarkup = (item) => `
				<button class="page-search-result" type="button" data-result-index="${item.index}">
					${item.imageUrl ? `<img src="${escapeHtml(item.imageUrl)}" alt="">` : `<div style="width:82px;height:65px;border-radius:7px;background:linear-gradient(135deg,#eaf5f8,#dfeef3);display:grid;place-items:center;color:#102f59;font-size:1.2rem;">${item.icon || "•"}</div>`}
					<span>
						<strong>${escapeHtml(item.title || "نتيجة")}</strong>
						<small>${escapeHtml(item.description || "")}</small>
					</span>
				</button>`;

			const updateResults = async () => {
				const term = input.value.trim().toLowerCase();
				const category = categorySelect.value;
				let newsResults = [];
				let articlesResults = [];
				const [newsSnapshot, articlesSnapshot, testsList, meetingsList] = await Promise.all([
					(category === "all" || category === "news")
						? getDocs(query(collection(db, "news"), orderBy("createdAt", "desc")))
						: Promise.resolve({ docs: [] }),
					(category === "all" || category === "articles")
						? getDocs(query(collection(db, "articles"), orderBy("createdAt", "desc")))
						: Promise.resolve({ docs: [] }),
					(category === "all" || category === "tests")
						? loadTestsList()
						: Promise.resolve([]),
					(category === "all" || category === "meetings")
						? loadUserCollection("meetings")
						: Promise.resolve([])
				]);

				const matches = [];
				const pushMatches = (items, categoryName, mapper, icon) => {
					items.forEach((item) => {
						const searchable = mapper(item);
						if (!term || searchable.toLowerCase().includes(term)) {
							matches.push({
								...item,
								category: categoryName,
								icon,
								searchText: searchable,
								index: matches.length
							});
						}
					});
				};

				if (category === "all" || category === "news") {
					newsResults = newsSnapshot.docs.map((item) => ({ id: item.id, ...item.data() })).filter((item) => item.isVisible !== false);
					pushMatches(newsResults, "news", (item) => `${item.title || ""} ${item.description || ""}`.trim(), "📰");
				}

				if (category === "all" || category === "articles") {
					articlesResults = articlesSnapshot.docs
						.map((item) => ({ id: item.id, ...item.data() }))
						.filter((item) => item.isVisible !== false);
					pushMatches(articlesResults, "articles", (item) => `${item.title || ""} ${item.summary || ""} ${item.description || ""}`.trim(), "▤");
				}

				if (category === "all" || category === "library") {
					const libraryMatches = [];
					libraryPages.forEach((page) => {
						const visibleFiles = Array.isArray(page.files)
							? page.files.filter((file) => canUserViewLibraryFile(page, file))
							: [];
						if (!term || `${page.name || ""} ${page.description || ""}`.toLowerCase().includes(term)) {
							libraryMatches.push({
								title: page.name || "صفحة مكتبة",
								description: page.description || "صفحة مكتبة",
								imageUrl: "",
								pageId: page.id,
								action: () => renderPage(`library:${page.id}`),
								icon: "📚",
								category: "library"
							});
						}
						visibleFiles.forEach((file) => {
							const fileText = `${file.name || ""} ${file.type || ""}`.trim();
							if (!term || fileText.toLowerCase().includes(term)) {
								libraryMatches.push({
									title: file.name || "ملف مكتبة",
									description: `${page.name || "صفحة مكتبة"} · ${file.type || "ملف"}`,
									imageUrl: file.url,
									action: () => openLibraryFile(file, page),
									icon: "📄",
									category: "library"
								});
							}
						});
					});
					matches.push(...libraryMatches);
				}

				if (category === "all" || category === "tests") {
					pushMatches(testsList, "tests", (item) => `${item.title || ""} ${item.description || ""}`.trim(), "✓");
				}

				if (category === "all" || category === "meetings") {
					pushMatches(meetingsList, "meetings", (item) => `${item.title || item.name || ""} ${item.description || ""}`.trim(), "◷");
				}

				if (category !== "all") {
					const allowedCategories = [category];
					for (let i = matches.length - 1; i >= 0; i -= 1) {
						if (!allowedCategories.includes(matches[i].category)) {
							matches.splice(i, 1);
						}
					}
				}

				results.innerHTML = matches.length
					? matches.map((item, index) => {
						const result = { ...item, index };
						return buildResultMarkup(result);
					}).join("")
					: "لا توجد نتائج مطابقة.";

				results.querySelectorAll(".page-search-result").forEach((button) => {
					const index = Number(button.dataset.resultIndex);
					button.addEventListener("click", () => {
						const match = matches[index];
						if (!match) return;
						if (match.category === "news") {
							const newsItem = newsResults.find((item) => item.id === match.id);
							if (newsItem) showNewsModal(newsItem);
							return;
						}
						if (match.category === "articles") {
							const articleItem = articlesResults.find((item) => item.id === match.id);
							if (articleItem) openArticleModal(articleItem);
							return;
						}
						if (match.category === "tests") {
							openTestModal(match.id);
							return;
						}
						if (match.category === "meetings") {
							renderPage("meetings");
							return;
						}
						if (match.action) match.action();
					});
				});
			};

			input.addEventListener("input", updateResults);
			categorySelect.addEventListener("change", updateResults);
			await updateResults();
		}

		async function loadTestsList() {
			try {
				const snapshot = await getDocs(query(collection(db, "tests"), orderBy("createdAt", "desc")));
				return snapshot.docs
					.map((item) => ({ id: item.id, ...item.data() }))
					.filter((test) => {
						const assignedUserIds = Array.isArray(test.assignedUserIds) ? test.assignedUserIds.filter(Boolean) : [];
						return assignedUserIds.length === 0 || assignedUserIds.includes(sessionUser.uid);
					});
			} catch (error) {
				console.warn("تعذر تحميل الاختبارات:", error);
				return [];
			}
		}

		async function loadUserTestAttempts() {
			try {
				const snapshot = await getDocs(collection(db, "testAttempts"));
				return snapshot.docs
					.map((item) => ({ id: item.id, ...item.data() }))
					.filter((item) => item.userId === sessionUser.uid);
			} catch (error) {
				console.warn("تعذر تحميل محاولات الاختبارات:", error);
				return [];
			}
		}

		function getRemainingTestSeconds(test, attempt) {
			if (!attempt || attempt.isCompleted) return 0;
			const startedAt = firestoreDate(attempt.startedAt);
			const durationSeconds = Number(test.durationMinutes || 0) * 60;
			if (!startedAt) return durationSeconds;
			const elapsedSeconds = Math.floor((Date.now() - startedAt.getTime()) / 1000);
			return Math.max(0, durationSeconds - elapsedSeconds);
		}

		function formatDuration(seconds) {
			const safeSeconds = Math.max(0, Math.floor(seconds));
			const minutes = Math.floor(safeSeconds / 60);
			const remainingSeconds = safeSeconds % 60;
			return `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
		}

		async function renderTests(panel) {
			panel.innerHTML = `
				<div class="panel-heading"><div class="panel-icon" aria-hidden="true">✓</div><div><span class="panel-tag">اختبر معرفتك</span><h2>الاختبارات</h2><p>اختر اختبارًا، وابدأه الآن أو استأنف محاولتك إذا كان الوقت متبقيًا.</p></div></div>
				<div class="tests-grid" id="testsGrid">جاري تحميل الاختبارات...</div>`;
			const tests = await loadTestsList();
			const attempts = await loadUserTestAttempts();
			const testsGrid = document.getElementById("testsGrid");
			if (!testsGrid || currentPage !== "tests") return;
			if (!tests.length) {
				testsGrid.innerHTML = `<div class="empty-state">لا توجد اختبارات متاحة حاليًا.</div>`;
				return;
			}
			testsGrid.innerHTML = tests.map((test) => {
				const attempt = attempts.find((item) => item.testId === test.id) || null;
				const remainingSeconds = getRemainingTestSeconds(test, attempt);

				const isCompleted = !!attempt && attempt.isCompleted;
				const statusText = isCompleted
					? `تمت بنجاح - ${attempt.correctCount || 0}/${test.questions?.length || 0}`
					: canResume
						? `متبقي ${formatDuration(remainingSeconds)}`
						: attempt
							? `انتهت المحاولة`
							: `متاح الآن`;
				return `
					<article class="test-card">
						${test.imageUrl ? `<img src="${escapeHtml(test.imageUrl)}" alt="${escapeHtml(test.title || "اختبار")}">` : `<div class="test-card-placeholder">اختبار</div>`}
						<div class="test-card-body">
							<h3>${escapeHtml(test.title || "اختبار")}</h3>
							<p>${escapeHtml(test.description || "لا يوجد وصف لهذا الاختبار.")}</p>
							<div class="test-meta">
								<span>المدة: ${Number(test.durationMinutes || 0)} دقيقة</span>
								<span>الأسئلة: ${test.questions?.length || 0}</span>
							</div>
							<div class="test-status">${statusText}</div>
							<button class="test-start-btn" type="button" data-test-id="${escapeHtml(test.id)}">${isCompleted ? "عرض النتيجة" : canResume ? "استئناف الاختبار" : "ابدأ الاختبار"}</button>
						</div>
					</article>`;
			}).join("");
			testsGrid.querySelectorAll(".test-start-btn").forEach((button) => {
				button.addEventListener("click", () => openTestModal(button.dataset.testId));
			});
		}

		async function openTestModal(testId) {
			const test = (await loadTestsList()).find((item) => item.id === testId);
			if (!test) return;
			const attempts = await loadUserTestAttempts();
			let attempt = attempts.find((item) => item.testId === testId) || null;
			if (!attempt) {
				const newAttempt = {
					testId,
					userId: sessionUser.uid,
					userName: activeUserData?.name || activeUserData?.email || "مستخدم",
					startedAt: new Date(),
					durationSeconds: Number(test.durationMinutes || 0) * 60,
					currentAnswers: Array(test.questions?.length || 0).fill(null),
					isCompleted: false,
					createdAt: new Date()
				};
				const docRef = await addDoc(collection(db, "testAttempts"), newAttempt);
				attempt = { id: docRef.id, ...newAttempt };
			}
			const modal = document.createElement("div");
			modal.className = "news-modal";
			modal.innerHTML = `
				<div class="test-modal-shell">
					<button type="button" class="news-modal-close" aria-label="إغلاق" style="top:18px; right:18px;">×</button>
					<div class="test-modal-header">
						<div>
							<h2 class="test-modal-title">${escapeHtml(test.title || "اختبار")}</h2>
							<p class="test-modal-description">${escapeHtml(test.description || "")}</p>
						</div>
						<div id="testTimer" class="test-modal-timer">${formatDuration(getRemainingTestSeconds(test, attempt))}</div>
					</div>
					<div id="testQuestionContent" style="flex:1; min-height:0; overflow:auto; padding-inline-end:6px;"></div>
				</div>`;
			document.body.appendChild(modal);
			const questionContent = modal.querySelector("#testQuestionContent");
			const timerNode = modal.querySelector("#testTimer");
			const closeButton = modal.querySelector(".news-modal-close");
			let currentAnswers = Array.isArray(attempt.currentAnswers) ? [...attempt.currentAnswers] : Array(test.questions?.length || 0).fill(null);
			let currentQuestionIndex = Number.isInteger(attempt.currentQuestionIndex) ? attempt.currentQuestionIndex : 0;
			if (currentQuestionIndex >= (test.questions?.length || 0)) currentQuestionIndex = 0;
			let remainingSeconds = getRemainingTestSeconds(test, attempt);
			let timerHandle = null;

			const renderQuestion = () => {
				const question = test.questions[currentQuestionIndex];
				if (!question) return;
				questionContent.innerHTML = `
					<div class="test-question-shell">
						<div class="test-question-meta">
							<span class="test-question-badge">السؤال ${currentQuestionIndex + 1} من ${test.questions.length}</span>
							<span class="test-question-help">اختر إجابة واحدة فقط</span>
						</div>
						<h3 class="test-question-title">${escapeHtml(question.text || "سؤال")}</h3>
						${question.imageUrl ? `<img class="test-question-image" src="${escapeHtml(question.imageUrl)}" alt="${escapeHtml(question.text || "سؤال")}">` : ""}
						<div class="test-question-options">
							${question.options.map((option, optionIndex) => `
								<button type="button" class="test-option-btn ${currentAnswers[currentQuestionIndex] === optionIndex ? "active" : ""}" data-option-index="${optionIndex}">
									<span>${escapeHtml(String(option || ""))}</span>
									<span class="test-option-letter">${currentAnswers[currentQuestionIndex] === optionIndex ? "✓" : String.fromCharCode(65 + optionIndex)}</span>
								</button>
							`).join("")}
						</div>
						<div class="test-question-nav">
							<button type="button" id="prevQuestion" class="test-prev-btn" ${currentQuestionIndex === 0 ? "disabled" : ""}>السابق</button>
							<button type="button" id="nextQuestion" class="test-next-btn">${currentQuestionIndex === test.questions.length - 1 ? "إنهاء الاختبار" : "التالي"}</button>
						</div>
					</div>`;
				modal.querySelectorAll(".test-option-btn").forEach((button) => {
					button.addEventListener("click", async () => {
						currentAnswers[currentQuestionIndex] = Number(button.dataset.optionIndex);
						await updateDoc(doc(db, "testAttempts", attempt.id), {
							currentAnswers,
							currentQuestionIndex,
							lastUpdatedAt: new Date()
						});
						renderQuestion();
					});
				});
				const prevQuestion = modal.querySelector("#prevQuestion");
				if (prevQuestion) {
					prevQuestion.disabled = currentQuestionIndex === 0;
					prevQuestion.addEventListener("click", async () => {
						currentQuestionIndex = Math.max(0, currentQuestionIndex - 1);
						await updateDoc(doc(db, "testAttempts", attempt.id), {
							currentQuestionIndex,
							lastUpdatedAt: new Date()
						}).catch((error) => console.warn("تعذر حفظ موضع السؤال:", error));
						renderQuestion();
					});
				}
				const nextQuestion = modal.querySelector("#nextQuestion");
				nextQuestion.addEventListener("click", async () => {
					if (currentQuestionIndex < test.questions.length - 1) {
						currentQuestionIndex += 1;
						await updateDoc(doc(db, "testAttempts", attempt.id), {
							currentQuestionIndex,
							lastUpdatedAt: new Date()
						}).catch((error) => console.warn("تعذر حفظ موضع السؤال:", error));
						renderQuestion();
						return;
					}
					await finishTest(test, attempt, currentAnswers, modal);
				});
			};

			const tick = () => {
				remainingSeconds = getRemainingTestSeconds(test, attempt);
				timerNode.textContent = formatDuration(remainingSeconds);
				if (remainingSeconds <= 0) {
					clearInterval(timerHandle);
					finishTest(test, attempt, currentAnswers, modal);
				}
			};
			timerHandle = setInterval(tick, 1000);
			closeButton.addEventListener("click", () => {
				clearInterval(timerHandle);
				modal.remove();
			});
			modal.addEventListener("click", (event) => {
				if (event.target === modal) {
					clearInterval(timerHandle);
					modal.remove();
				}
			});
			renderQuestion();
		}

		async function finishTest(test, attempt, currentAnswers, modal) {
			if (!modal || modal.dataset.finished === "true") return;
			modal.dataset.finished = "true";
			const questions = Array.isArray(test.questions) ? test.questions : [];
			const correctCount = questions.reduce((count, question, index) => {
				return count + (Number(currentAnswers[index]) === Number(question.correctIndex) ? 1 : 0);
			}, 0);
			const wrongQuestions = questions
				.filter((question, index) => Number(currentAnswers[index]) !== Number(question.correctIndex))
				.map((question, index) => ({ index: questions.findIndex((item) => item === question), text: question.text }));
			const normalizedAnswers = Array.isArray(currentAnswers) ? currentAnswers : Array(questions.length).fill(null);
			const attemptsDoc = doc(db, "testAttempts", attempt.id);
			await updateDoc(attemptsDoc, {
				currentAnswers: normalizedAnswers,
				isCompleted: true,
				completedAt: new Date(),
				correctCount,
				wrongQuestions: wrongQuestions.map((item) => ({ questionNumber: item.index + 1, text: item.text })),
				totalQuestions: questions.length,
				totalAnswered: normalizedAnswers.filter((answer) => answer !== null && answer !== undefined).length,
				score: correctCount
			});
			if (modal) {
				modal.innerHTML = `
					<div class="news-modal-box" style="max-width: 760px; padding: 24px;">
						<button type="button" class="news-modal-close" aria-label="إغلاق">×</button>
						<h2 style="margin:0 0 10px; color:#102f59;">تم إنهاء الاختبار</h2>

		function openJitsiMeeting(meeting) {

				 title.textContent = meeting.title || meeting.name || "اجتماع بريفنتا";

			title.textContent = meeting.title || meeting.name || "اجتماع بريفنتا";

					startWithAudioMuted: true,
					startWithVideoMuted: true,
					prejoinPageEnabled: false,
					lobby: { enabled: meeting.waitingRoom === true }
				},
				interfaceConfigOverwrite: {
					TOOLBAR_BUTTONS: ["microphone", "camera", "desktop", "fullscreen", "hangup", "chat", "raisehand", "tileview"]
				}
			});
			activeMeetingUnsubscribe = onSnapshot(doc(db, "meetings", meeting.id), (snapshot) => {
				if (!snapshot.exists() || snapshot.data().isEnded === true || snapshot.data().isCancelled === true) {
					if (activeMeetingApi) { activeMeetingApi.dispose(); activeMeetingApi = null; }

		function setupChat() {
			const messagesBox = document.getElementById("chatMessages");
			const form = document.getElementById("chatForm");
			const textInput = document.getElementById("chatText");
			const fileInput = document.getElementById("chatFile");
			const fileName = document.getElementById("chatFileName");
			const replying = document.getElementById("chatReplying");
			const replyingText = document.getElementById("chatReplyingText");
			let replyTo = null;
			fileInput.addEventListener("change", () => { fileName.textContent = fileInput.files[0] ? `الملف المحدد: ${fileInput.files[0].name}` : ""; });
			document.getElementById("cancelReply").addEventListener("click", () => { replyTo = null; replying.classList.remove("show"); });

			const renderMessages = (snapshot) => {
				const messages = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
				messagesBox.innerHTML = messages.length ? messages.map((message) => {
					const mine = message.senderId === sessionUser.uid;
					const date = firestoreDate(message.createdAt);
					const reply = message.replyTo ? `<div class="chat-reply-preview">رد على: ${escapeHtml(message.replyTo.text || message.replyTo.name || "رسالة")}</div>` : "";
					const attachment = renderChatAttachment(message.attachment);
					const isAdminMessage = message.isAdmin || message.senderRole === "admin";
					const roleBadge = isAdminMessage ? '<span class="chat-role-badge">مشرف</span>' : "";
					return `<article class="chat-message${mine ? " mine" : ""}"><img class="chat-avatar" src="${escapeHtml(message.senderPhoto || "6384.png")}" alt=""><div class="chat-message-body"><p class="chat-author">${escapeHtml(message.senderName || "عضو في المجتمع")}${roleBadge}<time>${date ? formatClock(date) : "الآن"}</time></p><div class="chat-bubble">${reply}${escapeHtml(message.text || "")}${attachment}</div><button class="chat-reply-button" type="button" data-reply-id="${message.id}" data-reply-name="${escapeHtml(message.senderName || "العضو")}" data-reply-text="${escapeHtml(message.text || message.attachment?.name || "الرسالة")}">↩ الرد</button></div></article>`;
				}).join("") : "<p class=\"chat-empty\">لا توجد رسائل بعد. كن أول من يبدأ الحديث.</p>";
				messagesBox.scrollTop = messagesBox.scrollHeight;
				messagesBox.querySelectorAll("[data-reply-id]").forEach((button) => button.addEventListener("click", () => { replyTo = { id: button.dataset.replyId, name: button.dataset.replyName, text: button.dataset.replyText }; replyingText.textContent = `أنت ترد على: ${replyTo.name}`; replying.classList.add("show"); textInput.focus(); }));
			};

			try {
				onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "asc")), renderMessages, (error) => { console.error("Chat read failed:", error); messagesBox.innerHTML = "<p class=\"chat-empty\">تعذر تحميل المحادثة. تأكد من نشر قواعد Firestore.</p>"; });
			} catch (error) { messagesBox.innerHTML = "<p class=\"chat-empty\">تعذر تشغيل المحادثة.</p>"; }

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				const text = textInput.value.trim();
				const file = fileInput.files[0];
				if (!text && !file) return;
				try { await ensureChatAuth(); } catch (authError) { console.error("Chat authentication failed:", authError); alert("تعذر تشغيل جلسة الدردشة. تأكد من تفعيل Anonymous في Firebase ثم أعد تحميل الصفحة."); return; }
				const sendButton = form.querySelector("button[type=submit]");
				sendButton.disabled = true;
				try {
					let attachment = null;
					if (file) {
						if (file.size > 20 * 1024 * 1024) throw new Error("حجم الملف أكبر من 20 ميجابايت");
						if (file.type.startsWith("image/")) {
							fileName.textContent = `جاري تجهيز الصورة ${file.name}...`;
							const imageData = await compressImage(file);
							attachment = { name: file.name, type: file.type, size: file.size, url: imageData, inline: true };
							fileName.textContent = "تم تجهيز الصورة، جاري إرسال الرسالة...";
						} else if (file.size <= 700 * 1024) {
							fileName.textContent = `جاري تجهيز الملف ${file.name}...`;
							const fileData = await fileToDataUrl(file);
							attachment = { name: file.name, type: file.type || "application/octet-stream", size: file.size, url: fileData, inline: true };
							fileName.textContent = "تم تجهيز الملف، جاري إرسال الرسالة...";
						} else {
							fileName.textContent = `جاري رفع ${file.name}... 0%`;
							const safeFileName = file.name.replace(/[\\/#?%:*|"<>]/g, "_");
							const fileRef = ref(storage, `chat/${auth.currentUser.uid}/${Date.now()}-${safeFileName}`);
							const upload = uploadBytesResumable(fileRef, file);
							const uploadSnapshot = await new Promise((resolve, reject) => {
								upload.on("state_changed", (snapshot) => {
									const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
									fileName.textContent = `جاري رفع ${file.name}... ${progress}%`;
								}, reject, () => resolve(upload.snapshot));
							});
							attachment = { name: file.name, type: file.type, size: file.size, url: await getDownloadURL(uploadSnapshot.ref) };
							fileName.textContent = "تم رفع الملف، جاري إرسال الرسالة...";
						}
					}
					await addDoc(collection(db, "messages"), { text, senderId: sessionUser.uid, senderName: activeUserData.name || activeUserData.email || "عضو في المجتمع", senderPhoto: activeUserData.photoData || activeUserData.photoURL || activeUserData.photo || "6384.png", attachment, replyTo, createdAt: serverTimestamp() });
					form.reset(); fileName.textContent = ""; replyTo = null; replying.classList.remove("show");
				} catch (error) { console.error("Chat send failed:", error); alert(error.message || "تعذر إرسال الرسالة."); } finally { sendButton.disabled = false; }
			});
		}

		function renderChatAttachment(attachment) {

			const url = escapeHtml(attachment.url);
			const name = escapeHtml(attachment.name || "الملف المرفق");
			if ((attachment.type || "").startsWith("image/")) {
				return `<a href="${url}" target="_blank" rel="noopener"><img class="chat-attachment-image" src="${url}" alt="${name}"></a><a class="chat-download" href="${url}" download="${name}">⬇ تحميل الصورة</a>`;
			}
			return `<a class="chat-attachment" href="${url}" target="_blank" rel="noopener">📎 ${name}</a><a class="chat-download" href="${url}" download="${name}">⬇ تحميل الملف</a>`;
		}

			title.textContent = meeting.title || meeting.name || "اجتماع Preventa Plus";

				document.querySelectorAll("[data-page]").forEach((item) => item.classList.toggle("active", item.dataset.page === "meetings"));
				renderPage("meetings");
			};
			const update = () => {
				const remaining = Math.max(0, meeting.date.getTime() - Date.now());
				const totalMinutes = Math.floor(remaining / 60000);
				document.getElementById("meetingDays").textContent = String(Math.floor(totalMinutes / 1440)).padStart(2, "0");
				document.getElementById("meetingHours").textContent = String(Math.floor((totalMinutes % 1440) / 60)).padStart(2, "0");
				document.getElementById("meetingMinutes").textContent = String(totalMinutes % 60).padStart(2, "0");
				if (remaining <= 15 * 60 * 1000) button.classList.add("ready");
			};
			update();
			setInterval(update, 30000);
		}

		function compressImage(file) {
			return new Promise((resolve, reject) => {
				const reader = new FileReader();
				reader.onload = () => {
					const image = new Image();
					image.onload = () => {
						const scale = Math.min(1, 500 / Math.max(image.width, image.height));
						const canvas = document.createElement("canvas");
						canvas.width = Math.max(1, Math.round(image.width * scale));
						canvas.height = Math.max(1, Math.round(image.height * scale));
						canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
						resolve(canvas.toDataURL("image/jpeg", .8));
					};
					image.onerror = reject;
					image.src = reader.result;
				};
				reader.onerror = reject;
				reader.readAsDataURL(file);
			});
		}

		function fileToDataUrl(file) {
			return new Promise((resolve, reject) => {
				const reader = new FileReader();
				reader.onload = () => resolve(reader.result);
				reader.onerror = () => reject(new Error("تعذر قراءة الملف"));
				reader.readAsDataURL(file);
			});
		}

				appShell.classList.add("sidebar-open");
				document.body.classList.add("sidebar-open");
				mobileSidebarToggle?.setAttribute("aria-expanded", "true");
				mobileSidebarToggle?.setAttribute("aria-label", "إغلاق القائمة الجانبية");
			};
			
			const closeNewsModal = () => { newsModal.hidden = true; };
			const closeLibraryModal = () => {
				libraryModal.hidden = true;
				document.getElementById("libraryModalPreview").innerHTML = "";
				if (activeLibraryBlobUrl) {
					URL.revokeObjectURL(activeLibraryBlobUrl);
					activeLibraryBlobUrl = null;
				}
			};
			
			document.getElementById("newsModalClose").addEventListener("click", closeNewsModal);
			document.getElementById("libraryModalClose").addEventListener("click", closeLibraryModal);
			newsModal.addEventListener("click", (event) => { if (event.target === newsModal) closeNewsModal(); });
			libraryModal.addEventListener("click", (event) => { if (event.target === libraryModal) closeLibraryModal(); });
			sidebarClose?.addEventListener("click", closeSidebar);
			sidebarOverlay?.addEventListener("click", closeSidebar);
			document.addEventListener("keydown", (event) => { if (event.key === "Escape") { closeSidebar(); closeNewsModal(); closeLibraryModal(); } });
			
			searchToggle?.addEventListener("click", () => {
				if (currentPage === "home") return;
				searchPanel.classList.remove("open");
				notificationsPanel?.classList.remove("open");
				renderPage("search");
			});
			
			refreshButton?.addEventListener("click", () => window.location.reload());
			lockButton?.addEventListener("click", () => {
				sessionStorage.removeItem(sessionKey);
				window.location.replace("index.html");
			});
			
			notificationToggle?.addEventListener("click", () => {
				searchPanel.classList.remove("open");
				notificationsPanel?.classList.toggle("open");
				if (notificationsPanel?.classList.contains("open")) positionDropdown(notificationsPanel, notificationToggle);
				if (headerNotificationDot) headerNotificationDot.style.display = "none";
			});
			
			window.addEventListener("resize", () => {
				if (searchPanel.classList.contains("open")) positionDropdown(searchPanel, searchToggle);
				if (notificationsPanel?.classList.contains("open")) positionDropdown(notificationsPanel, notificationToggle);
			});
			
			window.addEventListener("scroll", () => {
				if (searchPanel.classList.contains("open")) positionDropdown(searchPanel, searchToggle);
				if (notificationsPanel?.classList.contains("open")) positionDropdown(notificationsPanel, notificationToggle);
			}, { passive: true });
			
			languageButton?.addEventListener("click", () => {
				currentLanguage = currentLanguage === "ar" ? "en" : "ar";
				localStorage.setItem("dashboardLanguage", currentLanguage);
				applyLanguage();
				renderPage(currentPage);
			});
			
			desktopSidebarToggle?.addEventListener("click", () => {
				const isCollapsed = appShell.classList.toggle("sidebar-collapsed");
				desktopSidebarToggle.setAttribute("aria-expanded", String(!isCollapsed));
				desktopSidebarToggle.setAttribute("aria-label", isCollapsed ? "توسيع القائمة الجانبية" : "تصغير القائمة الجانبية");
			});
			mobileSidebarToggle?.addEventListener("click", () => {
				if (appShell.classList.contains("sidebar-open")) closeSidebar();
				else openSidebar();
			});
			
			libraryToggle.addEventListener("click", () => {
				const isOpen = libraryItems.classList.toggle("open");
				libraryToggle.classList.toggle("open", isOpen);
				libraryToggle.setAttribute("aria-expanded", String(isOpen));
			});

			sidebar?.addEventListener("click", (event) => {
				const button = event.target.closest("[data-page]");
				if (!button || button.closest("#libraryToggle")) return;
				event.preventDefault();
				event.stopPropagation();
				document.querySelectorAll("[data-page]").forEach((item) => item.classList.remove("active"));
				button.classList.add("active");
				renderPage(button.dataset.page);
				if (window.innerWidth <= 800) closeSidebar();
			});

			document.getElementById("userBadge")?.addEventListener("click", (event) => {
				event.preventDefault();
				renderPage("profile");
				document.querySelectorAll("[data-page]").forEach((item) => item.classList.toggle("active", item.dataset.page === "profile"));
			});

			document.getElementById("contentPanel").addEventListener("click", (event) => {
				const button = event.target.closest("[data-page]");
				if (!button) return;
				event.preventDefault();
				renderPage(button.dataset.page);
			});

			document.getElementById("logoutButton").addEventListener("click", () => {
				sessionStorage.removeItem(sessionKey);
				window.location.replace("index.html");
			});
		}

		async function updateNotificationBadges() {
			try {
				const notifications = [];
				const addNotification = (type, title, message, page, icon) => notifications.push({ type, title, message, page, icon });
				
				const nextMeeting = await loadNextMeeting();
				const badgeMeetings = document.getElementById('badge-meetings');
				if (badgeMeetings) badgeMeetings.style.display = nextMeeting ? 'block' : 'none';
				if (nextMeeting) addNotification('meeting', 'اجتماع قادم', nextMeeting.title || nextMeeting.name || 'لديك اجتماع قادم', 'meetings', 'fa-calendar-days');

				const tests = await loadTestsList();
				const attempts = await loadUserTestAttempts();
				const hasUncompletedTests = tests.some(test => {
					const attempt = attempts.find(a => a.testId === test.id);
					return !attempt || !attempt.isCompleted;
				});
				const badgeTests = document.getElementById('badge-tests');
				if (badgeTests) badgeTests.style.display = hasUncompletedTests ? 'block' : 'none';
				if (hasUncompletedTests) addNotification('test', 'اختبار متاح', 'لديك اختبار لم تكمله بعد', 'tests', 'fa-clipboard-check');

				const articlesObj = await loadArticles();
				const threeDaysAgo = new Date();
				threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
				const hasNewArticles = articlesObj.some(art => {
					const d = firestoreDate(art.createdAt);
					return d && d > threeDaysAgo;
				});
				const badgeArticles = document.getElementById('badge-articles');
				if (badgeArticles) badgeArticles.style.display = hasNewArticles ? 'block' : 'none';
				if (hasNewArticles) addNotification('article', 'مقال جديد', 'تم نشر مقال جديد في المنصة', 'articles', 'fa-newspaper');

				const msgsSnapshot = await getDocs(query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(1)));
				let hasNewMsg = false;
				if (!msgsSnapshot.empty) {
					const lastMsg = msgsSnapshot.docs[0].data();
					if (lastMsg.senderId !== sessionUser.uid) hasNewMsg = true;
				}
				const badgeCommunity = document.getElementById('badge-community');
				if (badgeCommunity) badgeCommunity.style.display = hasNewMsg ? 'block' : 'none';
				if (hasNewMsg) addNotification('community', 'رسالة جديدة', 'لديك رسالة جديدة من المجتمع', 'community', 'fa-users');

				const supportSnapshot = await getDocs(query(collection(db, "support_tickets")));
				const myTickets = supportSnapshot.docs.map(d => d.data()).filter(t => t.userId === sessionUser.uid);
				const hasActiveSupport = myTickets.some(t => t.status === 'open' || t.status === 'pending');
				const badgeSupport = document.getElementById('badge-support');
				if (badgeSupport) badgeSupport.style.display = hasActiveSupport ? 'block' : 'none';
				if (hasActiveSupport) addNotification('support', 'تحديث الدعم الفني', 'لديك تذكرة مفتوحة أو قيد المراجعة', 'support', 'fa-circle-question');

				const badgeLibrary = document.getElementById('badge-library');
				if (badgeLibrary && typeof libraryPages !== 'undefined') {
					const libraryFileCount = libraryPages.reduce((total, page) => total + (Array.isArray(page.files) ? page.files.length : 0), 0);
					badgeLibrary.style.display = libraryFileCount > 0 ? 'block' : 'none';
					if (libraryFileCount > 0) addNotification('library', 'ملفات جديدة', `تم تحميل ${libraryFileCount} ملف في المكتبة`, 'library', 'fa-folder-open');
				}
				
				const hasNotification = [...document.querySelectorAll('.nav-badge')].some((badge) => getComputedStyle(badge).display !== 'none');
				const headerNotificationDot = document.getElementById("headerNotificationDot");
				if (headerNotificationDot) headerNotificationDot.style.display = hasNotification ? 'block' : 'none';
				
				const notificationsList = document.getElementById('notificationsList');
				if (notificationsList) {
					notificationsList.innerHTML = notifications.length
						? notifications.map((item, index) => `<button class="notification-item" type="button" data-notification-index="${index}"><i class="fa-solid ${item.icon}"></i><span><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.message)}</small></span></button>`).join('')
						: '<div class="notifications-empty">لا توجد إشعارات جديدة.</div>';
					notificationsList.querySelectorAll('[data-notification-index]').forEach((button) => button.addEventListener('click', () => {
						const item = notifications[Number(button.dataset.notificationIndex)];
						if (!item) return;
						document.getElementById('notificationsPanel')?.classList.remove('open');
						if (item.page === 'library') {
							renderPage(libraryPages[0] ? `library:${libraryPages[0].id}` : 'search');
						} else {
							renderPage(item.page);
						}
					}));
				}

			} catch (error) {
				console.warn("حدث خطأ أثناء جلب إشعارات القائمة الجانبية:", error);
			}
		}
		
	</script>
