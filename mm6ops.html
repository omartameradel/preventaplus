<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <title>لوحة تحكم الأدمن | إدارة الحسابات</title>
  <!-- تضمين Bootstrap 3 للواجهة -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <style>
    body { background-color: #FDF9EC; font-family: 'Arial', sans-serif; }
    .admin-wrapper { background-color: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .badge-active { background-color: #5cb85c; }
    .badge-inactive { background-color: #d9534f; }
  </style>
</head>
<body>

<div class="container" style="margin-top: 50px;">
  <div class="row">
    
    <!-- قسم إنشاء حساب جديد -->
    <div class="col-sm-4">
      <div class="admin-wrapper">
        <h3 style="margin-top: 0; margin-bottom: 20px;">إنشاء حساب جديد</h3>
        <form id="admin-create-user-form">
          <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" class="form-control" id="new-name" required>
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" class="form-control" id="new-email" required>
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" class="form-control" id="new-phone" dir="ltr" required>
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="text" class="form-control" id="new-password" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
        </form>
      </div>
    </div>

    <!-- قسم عرض الحسابات -->
    <div class="col-sm-8">
      <div class="admin-wrapper">
        <h3 style="margin-top: 0; margin-bottom: 20px;">الحسابات المسجلة</h3>
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>الاسم</th>
                <th>البريد الإلكتروني</th>
                <th>رقم الهاتف</th>
                <th>كلمة المرور</th> <!-- تم التعديل هنا -->
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <!-- سيتم جلب الحسابات هنا -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal لتعديل بيانات المستخدم -->
<div class="modal fade" id="editUserModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" style="float: left;">&times;</button>
        <h4 class="modal-title">تعديل بيانات الحساب</h4>
      </div>
      <form id="edit-user-form">
        <div class="modal-body">
          <input type="hidden" id="edit-doc-id">
          <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" class="form-control" id="edit-name" required>
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" class="form-control" id="edit-email" required>
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" class="form-control" id="edit-phone" dir="ltr" required>
          </div>
          <div class="form-group">
            <label>كلمة المرور</label> <!-- تم إضافة الحقل هنا -->
            <input type="text" class="form-control" id="edit-password" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">حفظ التعديلات</button>
          <button type="button" class="btn btn-default" data-dismiss="modal">إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- تضمين مكتبات البوتستراب للـ Modal -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

<!-- كود Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, deleteDoc, updateDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // إعدادات مشروعك في فايربيس
  const firebaseConfig = {
    apiKey: "AIzaSyAA-iRIXpM_xkN3btGyr7elW8mwiuDbTLo",
    authDomain: "wallet-tamer-adel.firebaseapp.com",
    projectId: "wallet-tamer-adel",
    storageBucket: "wallet-tamer-adel.firebasestorage.app",
    messagingSenderId: "51007948250",
    appId: "1:51007948250:web:e1f6eaaebb4202b8aface3",
    measurementId: "G-M9LTMX3LHV"
  };

  // تهيئة التطبيق وقاعدة البيانات
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  // تطبيق مخصص لإنشاء الحسابات دون تسجيل خروج الأدمن
  const userCreationAuth = getAuth(initializeApp(firebaseConfig, "user-creation"));
  const db = getFirestore(app);
  const usersCollection = collection(db, "users");

  // ===================== 1. إنشاء الحساب وحفظ الباسوورد =====================
  const createUserForm = document.getElementById('admin-create-user-form');
  createUserForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('new-name').value;
    const email = document.getElementById('new-email').value;
    const phone = document.getElementById('new-phone').value;
    const password = document.getElementById('new-password').value;

    try {
      // التحقق مما إذا كان البريد الإلكتروني موجوداً مسبقاً في قاعدة البيانات
      const q = query(usersCollection, where("email", "==", email));
      const querySnapshot = await getDocs(q);

      if (!querySnapshot.empty) {
        alert("هذا البريد الإلكتروني مسجل بالفعل في قاعدة البيانات!");
        return; 
      }

      const credential = await createUserWithEmailAndPassword(userCreationAuth, email, password);
      
      // حفظ بيانات المستخدم بما فيها الباسوورد كنص
      await addDoc(usersCollection, {
        uid: credential.user.uid,
        name: name,
        email: email,
        phone: phone,
        password: password, // حفظ كلمة المرور
        isActive: true,
        createdAt: serverTimestamp()
      });

      alert("تم إنشاء الحساب بنجاح!");
      createUserForm.reset();
    } catch (error) {
      console.error(error);
      alert("حدث خطأ أثناء الحفظ: " + error.message);
    }
  });

  // ===================== 2. عرض الحسابات مع الباسوورد =====================
  const usersTableBody = document.getElementById('users-table-body');
  
  onSnapshot(usersCollection, (snapshot) => {
    usersTableBody.innerHTML = ""; 
    
    snapshot.forEach((docSnap) => {
      const user = docSnap.data();
      const docId = docSnap.id; 
      
      const statusBadge = user.isActive 
        ? `<span class="badge badge-active">مفعل</span>` 
        : `<span class="badge badge-inactive">معطل</span>`;
        
      const statusBtnText = user.isActive ? "تعطيل" : "تفعيل";
      const statusBtnClass = user.isActive ? "btn-warning" : "btn-success";

      // حماية العلامات المقتبسة إذا وجدت في الكلمات
      const safeName = (user.name || '').replace(/'/g, "\\'");
      const safeEmail = (user.email || '').replace(/'/g, "\\'");
      const safePhone = (user.phone || '').replace(/'/g, "\\'");
      const safePassword = (user.password || '').replace(/'/g, "\\'");

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${user.name}</td>
        <td>${user.email}</td>
        <td dir="ltr">${user.phone}</td>
        <td>${user.password || 'غير متوفرة'}</td> <!-- عرض كلمة المرور -->
        <td>${statusBadge}</td>
        <td>
          <button class="btn btn-xs ${statusBtnClass}" onclick="toggleStatus('${docId}', ${user.isActive})">${statusBtnText}</button>
          <button class="btn btn-xs btn-info" onclick="openEditModal('${docId}', '${safeName}', '${safeEmail}', '${safePhone}', '${safePassword}')">تعديل</button>
          <button class="btn btn-xs btn-danger" onclick="deleteUser('${docId}')">حذف</button>
        </td>
      `;
      usersTableBody.appendChild(tr);
    });
  });

  // ===================== 3. دوال التعديل، الحذف، والتفعيل =====================

  window.toggleStatus = async (docId, currentStatus) => {
    try {
      const userRef = doc(db, "users", docId);
      await updateDoc(userRef, {
        isActive: !currentStatus
      });
    } catch (error) {
      alert("حدث خطأ أثناء تغيير الحالة.");
    }
  };

  // فتح نافذة التعديل مع تمرير الباسوورد
  window.openEditModal = (docId, name, email, phone, password) => {
    document.getElementById('edit-doc-id').value = docId;
    document.getElementById('edit-name').value = name;
    document.getElementById('edit-email').value = email;
    document.getElementById('edit-phone').value = phone;
    document.getElementById('edit-password').value = password; // تعبئة كلمة المرور
    $('#editUserModal').modal('show'); 
  };

  // حفظ التعديلات بما فيها الباسوورد
  document.getElementById('edit-user-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const docId = document.getElementById('edit-doc-id').value;
    const newName = document.getElementById('edit-name').value;
    const newEmail = document.getElementById('edit-email').value;
    const newPhone = document.getElementById('edit-phone').value;
    const newPassword = document.getElementById('edit-password').value; // الباسوورد الجديد

    try {
      const userRef = doc(db, "users", docId);
      await updateDoc(userRef, {
        name: newName,
        email: newEmail,
        phone: newPhone,
        password: newPassword // حفظ الباسوورد الجديد في قاعدة البيانات
      });
      $('#editUserModal').modal('hide');
      alert("تم تحديث البيانات بنجاح.");
    } catch (error) {
      alert("حدث خطأ أثناء التحديث.");
    }
  });

  window.deleteUser = async (docId) => {
    if (confirm("هل أنت متأكد من حذف هذا الحساب نهائياً؟")) {
      try {
        await deleteDoc(doc(db, "users", docId));
      } catch (error) {
        alert("حدث خطأ أثناء الحذف.");
      }
    }
  };
</script>

</body>
</html>
